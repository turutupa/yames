<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The coach's blocks, every one of them, in all thirteen themes.

      A workbench for looking at them, not a screen in the app: nothing links
      here, and Vite's production build has one entry (index.html), so this
      page exists only on the dev server. `npm run dev` then open
      http://localhost:1420/blocks-gallery.html — or let the layout suite open
      it, which is what tests/layout/coach-blocks.spec.ts does.

      The same faces index.html pulls: several themes name a Google font as
      their first choice, and a gallery of the fallback stack would be a
      gallery of the wrong thing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Comfortaa:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <title>Yames — the coach's blocks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/coach/blocks/galleryMain.tsx"></script>
  </body>
</html>
