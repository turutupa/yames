name: Build & Release

on:
  push:
    # `phase0/**` so `llm-smoke` guards LLM work in progress. The `build`
    # job below still only runs for a `release …` commit or a manual
    # dispatch, so widening this does not publish anything.
    branches: [main, 'phase0/**']
  workflow_dispatch:

env:
  # CI-only test fixture for the LLM smoke job — SmolLM2-135M-Instruct
  # Q4_K_M, ~100 MB, pinned to an immutable Hugging Face revision. It is
  # never offered to or downloaded by users; the shipping model tiers are
  # in plans/ROADMAP.md §3. An instruction-tuned model rather than the
  # ~20 MB "stories" toys because those have a 256-token training context
  # (shorter than the coach system prompt) and no notion of following an
  # instruction, which makes "did it emit any text" a coin flip.
  TEST_GGUF_URL: 'https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q4_K_M.gguf'
  TEST_GGUF_SHA256: '2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d'

jobs:
  # =====================================================================
  # Gate (ROADMAP §5.0.1): on every platform the shipping LLM feature
  # compiles *and* a real GGUF loads and emits tokens. Runners have no
  # GPU, so a Vulkan/Metal build here exercises llama.cpp's runtime CPU
  # fallback — which is exactly the path a user without a usable driver
  # takes. Runs on every push, not only releases.
  # =====================================================================
  llm-smoke:
    name: llm-smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-aarch64
            target: aarch64-apple-darwin
            feature: coach-llm-metal
          - platform: macos-latest
            label: macos-x86_64
            target: x86_64-apple-darwin
            feature: coach-llm-metal
          - platform: ubuntu-22.04
            label: ubuntu-22.04
            target: ''
            feature: coach-llm-vulkan
          - platform: windows-latest
            label: windows
            target: ''
            feature: coach-llm-vulkan

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri's own Linux prerequisites — the lib target links against
      # webkit2gtk through the `tauri` crate even when only tests run.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: LLM build environment
        uses: ./.github/actions/llm-build-env

      # Caches ~/.cargo and the target dir. `prefix-key` carries the CMake
      # generator and Vulkan SDK: a restored `CMakeCache.txt` pins the
      # generator it was configured with, and a mismatched one fails with
      # "CMake was unable to find a build program corresponding to Ninja"
      # (observed in T02 development). Bump `v1` below whenever the
      # generator or the SDK version in the composite action changes.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: 'v1-ninja-vk1.4.313'
          key: ${{ matrix.label }}-${{ matrix.feature }}
          workspaces: 'src-tauri'

      - name: Cache the test GGUF
        id: gguf
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-model.gguf
          key: test-gguf-${{ env.TEST_GGUF_SHA256 }}

      - name: Download the test GGUF
        if: steps.gguf.outputs.cache-hit != 'true'
        shell: bash
        run: curl -fsSL --retry 5 --retry-delay 5 -o "${RUNNER_TEMP}/test-model.gguf" "$TEST_GGUF_URL"

      - name: Verify the test GGUF checksum
        shell: bash
        run: |
          set -euo pipefail
          # RUNNER_TEMP is a backslash path on Windows; Git Bash's find/cd
          # want the POSIX form.
          TMP="$RUNNER_TEMP"
          if command -v cygpath > /dev/null 2>&1; then TMP="$(cygpath -u "$RUNNER_TEMP")"; fi
          cd "$TMP"
          # sha256sum on Linux/Git-Bash, shasum on macOS.
          if command -v sha256sum > /dev/null 2>&1; then
            echo "${TEST_GGUF_SHA256}  test-model.gguf" | sha256sum -c -
          else
            echo "${TEST_GGUF_SHA256}  test-model.gguf" | shasum -a 256 -c -
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `tauri::generate_context!` in src/lib.rs embeds `../dist`, so the
      # lib target does not compile until the frontend has been built —
      # even for `cargo test --lib`.
      - name: Build frontend assets
        shell: bash
        run: |
          npm install
          npm run build

      - name: Load a GGUF and generate tokens
        shell: bash
        env:
          # Picked up by the `llm_tests` module added in T01; without it the
          # test logs a skip and passes vacuously, so it is always set here.
          YAMES_TEST_GGUF: ${{ runner.temp }}/test-model.gguf
        run: |
          set -euo pipefail
          # `--target` for the macOS entries so this really is the artifact
          # the release job ships; without it both macOS rows would build
          # the runner's own arm64 and the Intel bundle would go untested.
          # The x86_64 test binary runs under Rosetta on the arm64 runner.
          TARGET_ARG=""
          if [ -n "${{ matrix.target }}" ]; then TARGET_ARG="--target ${{ matrix.target }}"; fi
          # shellcheck disable=SC2086
          cargo test --manifest-path src-tauri/Cargo.toml $TARGET_ARG \
            --features ${{ matrix.feature }} --lib -- --nocapture

      # ROADMAP §5.0.1 budget: ≤ 80 MB of binary growth per platform. The
      # llama.cpp static libraries are where that growth lives (the Vulkan
      # backend embeds the compiled SPIR-V shaders), so surface them here;
      # the `build` job below reports the finished bundle sizes.
      - name: Record llama.cpp library sizes
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          TARGET="${CARGO_TARGET_DIR:-src-tauri/target}"
          if command -v cygpath > /dev/null 2>&1; then TARGET="$(cygpath -u "$TARGET")"; fi
          # `tee` so the numbers land in the step log as well as the job
          # summary — the summary is not readable through the API.
          {
            echo "### llm-smoke — ${{ matrix.label }} (\`${{ matrix.feature }}\`)"
            echo
            echo 'llama.cpp static libraries *before* linking — an upper'
            echo 'bound on the growth, not the shipped size. The `build` job'
            echo 'reports the finished bundles.'
            echo
            echo '| Artifact | Size |'
            echo '|---|---:|'
            total=0
            seen=""
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              # A cached target dir can hold several `llama-cpp-sys-2-<hash>`
              # trees (one per feature set built there); count each library
              # once.
              base="$(basename "$f")"
              case " $seen " in *" $base "*) continue ;; esac
              seen="$seen $base"
              bytes=$(wc -c < "$f" | tr -d ' ')
              total=$((total + bytes))
              printf '| `%s` | %s |\n' "$base" \
                "$(awk -v b="$bytes" 'BEGIN{printf "%.1f MiB", b/1048576}')"
            # Only the cmake *install* tree: `out/build/...` holds a second
            # copy of every library and would double the total.
            done < <(find "$TARGET" -type f -path '*/out/lib/*' \
                       \( -name 'libggml*' -o -name 'libllama*' \
                          -o -name 'ggml*.lib' -o -name 'llama*.lib' \) 2>/dev/null | sort -u)
            printf '| **total llama.cpp static libs** | **%s** |\n' \
              "$(awk -v b="$total" 'BEGIN{printf "%.1f MiB", b/1048576}')"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: llm-smoke
    if: startsWith(github.event.head_commit.message, 'release') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `-- --features …` — tauri-action passes `args` through verbatim
          # to `<tauriScript> build`, and the Tauri CLI forwards everything
          # after `--` to cargo. ROADMAP §3: always try the GPU first;
          # llama.cpp falls back to the CPU at runtime, so one binary per
          # platform serves both GPU and GPU-less machines.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin -- --features coach-llm-metal'
            target: aarch64-apple-darwin
            label: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin -- --features coach-llm-metal'
            target: x86_64-apple-darwin
            label: macos-x86_64
          - platform: ubuntu-22.04
            args: '-- --features coach-llm-vulkan'
            target: ''
            label: ubuntu-22.04
          - platform: windows-latest
            args: '-- --features coach-llm-vulkan'
            target: ''
            label: windows

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      # cmake / Ninja / MSVC / Vulkan SDK — see the composite action.
      - name: LLM build environment
        uses: ./.github/actions/llm-build-env

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: 'v1-ninja-vk1.4.313'
          key: release-${{ matrix.label }}
          workspaces: 'src-tauri'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        shell: bash
        run: |
          npm install
          npx tauri --version || (npm install @tauri-apps/cli && npx tauri --version)

      - name: Extract version from commit message
        id: version
        if: startsWith(github.event.head_commit.message, 'release')
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "No version found in commit message"
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      # Pinned to a tag: `@dev` is a moving branch, and this job is the only
      # thing standing between a `release …` commit and a published binary.
      # `args` is forwarded verbatim to `npx tauri build`, so the matrix'
      # `-- --features …` reaches cargo (verified against the action source
      # at action-v1.0.0: inputs.rawArgs → runner.execTauriCommand).
      #
      # With no `tagName` the action builds and uploads workflow artifacts
      # without touching Releases, which is what a `workflow_dispatch` run
      # on a feature branch wants.
      - name: Build Tauri app (release)
        id: tauri
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Yames ${{ steps.version.outputs.tag }}'
          releaseBody: |
            ## Yames 1.0

            ### Practice Coach (Beta)
            - AI-powered live feedback while you play — runs fully locally, no internet required
            - Real-time onset detection via **aubio** DSP engine with timing accuracy scoring
            - Session evaluation pipeline with adaptive suggestions and TTS voice feedback
            - Session history, coach chat UI, and audio input recording
            - Multi-channel input picker with loopback diagnostics

            ### Zen Mode — Radar Effect
            - New **Radar** zen style: polar grid mesh with a smooth conic-gradient sweep wake and persistent blip dots
            - **Cosmos** effect now draws connection lines between nearby particles forming triangular constellations
            - Gravity effect tuned: slower orbits, reduced density, consistent across all themes

            ### Polish
            - Practice Coach labelled **Beta** in the card header and settings section
            - Zen effect previews on the website for all 10 themes
            - Back button arrow alignment fix in coach card
            - Async Tauri commands — no more UI freeze on slow operations
          releaseDraft: false
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # Dispatch runs have no tag, so nothing is uploaded to Releases;
          # keep the bundles as workflow artifacts instead so the build is
          # still verifiable.
          uploadWorkflowArtifacts: ${{ steps.version.outputs.tag == '' }}

      # ROADMAP §5.0.1: binary growth budget ≤ 80 MB per platform, and the
      # actual numbers belong in the PR. `artifactPaths` is the action's own
      # list of what it produced.
      - name: Record bundle sizes
        if: always() && steps.tauri.outputs.artifactPaths
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -uo pipefail
          # `tee` so the numbers land in the step log too — the job summary
          # is not readable through the API.
          {
            echo "### Bundle sizes — ${{ matrix.label }}"
            echo
            echo '| Artifact | Size |'
            echo '|---|---:|'
            node -e '
            const fs = require("fs"), path = require("path");
            const du = (p) => {
              const st = fs.statSync(p);
              if (!st.isDirectory()) return st.size;
              return fs.readdirSync(p).reduce((n, e) => n + du(path.join(p, e)), 0);
            };
            for (const p of JSON.parse(process.env.ARTIFACT_PATHS)) {
              if (!fs.existsSync(p)) continue;
              const mib = (du(p) / 1048576).toFixed(1);
              console.log(`| \`${path.basename(p)}\` | ${mib} MiB |`);
            }
            '
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

  update-homebrew:
    needs: build
    if: startsWith(github.event.head_commit.message, 'release')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets
        run: sleep 30

      - name: Download DMGs and compute SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARM_URL="https://github.com/turutupa/yames/releases/download/v${VERSION}/Yames_${VERSION}_aarch64.dmg"
          INTEL_URL="https://github.com/turutupa/yames/releases/download/v${VERSION}/Yames_${VERSION}_x64.dmg"

          echo "Downloading ARM DMG..."
          curl -fSL -o arm.dmg "$ARM_URL" --retry 5 --retry-delay 10
          ARM_SHA=$(shasum -a 256 arm.dmg | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"

          echo "Downloading Intel DMG..."
          curl -fSL -o intel.dmg "$INTEL_URL" --retry 5 --retry-delay 10
          INTEL_SHA=$(shasum -a 256 intel.dmg | awk '{print $1}')
          echo "intel_sha=$INTEL_SHA" >> "$GITHUB_OUTPUT"

          echo "ARM SHA256: $ARM_SHA"
          echo "Intel SHA256: $INTEL_SHA"

      - name: Update cask formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARM_SHA: ${{ steps.sha.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.sha.outputs.intel_sha }}
        run: |
          cat > Casks/yames.rb << EOF
          cask "yames" do
            version "$VERSION"

            on_arm do
              url "https://github.com/turutupa/yames/releases/download/v#{version}/Yames_#{version}_aarch64.dmg"
              sha256 "$ARM_SHA"
            end

            on_intel do
              url "https://github.com/turutupa/yames/releases/download/v#{version}/Yames_#{version}_x64.dmg"
              sha256 "$INTEL_SHA"
            end

            name "Yames"
            desc "Yet Another Metronome Everyone Skips — musician-grade floating metronome"
            homepage "https://yames.app"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Yames.app"

            zap trash: [
              "~/Library/Application Support/com.yames.metronome",
              "~/Library/Caches/com.yames.metronome",
              "~/Library/Preferences/com.yames.metronome.plist",
            ]
          end
          EOF
          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Casks/yames.rb

      - name: Push cask to homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PAT: ${{ secrets.WINGET_PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/turutupa/homebrew-tap.git /tmp/homebrew-tap
          cp Casks/yames.rb /tmp/homebrew-tap/Casks/yames.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/yames.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update yames cask to v${VERSION}"
          git push

  update-winget:
    needs: build
    if: startsWith(github.event.head_commit.message, 'release')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version
        id: version
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets
        shell: bash
        run: sleep 30

      - name: Download EXE and compute SHA256
        id: sha
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $url = "https://github.com/turutupa/yames/releases/download/v$env:VERSION/Yames_${env:VERSION}_x64-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile installer.exe -MaximumRetryCount 5
          $hash = (Get-FileHash installer.exe -Algorithm SHA256).Hash
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Update winget manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          cat > winget/turutupa.yames.yaml << EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.singleton.1.12.0.schema.json
          PackageIdentifier: turutupa.yames
          PackageVersion: $VERSION
          PackageLocale: en-US
          Publisher: turutupa
          PublisherUrl: https://github.com/turutupa
          PackageName: Yames
          PackageUrl: https://yames.app
          License: MIT
          LicenseUrl: https://github.com/turutupa/yames/blob/main/LICENSE
          ShortDescription: Yet Another Metronome Everyone Skips — musician-grade floating metronome
          Description: |-
            A free, open-source desktop metronome with an always-on-top floating widget,
            sub-millisecond audio precision, zen mode with immersive visuals, drill practice mode,
            tap tempo, and 10 beautiful themes.
          Tags:
            - metronome
            - music
            - rhythm
            - practice
            - bpm
            - tempo
          Installers:
            - Architecture: x64
              InstallerType: nullsoft
              InstallerUrl: https://github.com/turutupa/yames/releases/download/v${VERSION}/Yames_${VERSION}_x64-setup.exe
              InstallerSha256: $SHA256
          ManifestType: singleton
          ManifestVersion: 1.12.0
          EOF
          sed -i 's/^          //' winget/turutupa.yames.yaml

      - name: Commit and push updated winget manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add winget/turutupa.yames.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update winget manifest to v${{ steps.version.outputs.version }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit PR to winget-pkgs
        continue-on-error: true
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $url = "https://github.com/turutupa/yames/releases/download/v$env:VERSION/Yames_${env:VERSION}_x64-setup.exe"
          .\wingetcreate.exe update turutupa.yames --version $env:VERSION --urls $url --submit --token $env:WINGET_PAT
