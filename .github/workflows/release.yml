name: Build & Release

# Publishing only. Everything that checks a commit lives in `ci.yml`;
# every job below is gated on a `release …` commit message or a manual
# dispatch, so an ordinary merge to main triggers this workflow and then
# skips all of it in seconds. That gating is unchanged since before the
# LLM work — what changed is that the smoke job no longer sits here
# running (and failing) on commits that were never going to publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ROADMAP §5.0.1 — nothing publishes with a dead brain. Shared with
  # `ci.yml` via `workflow_call` so `build` below keeps a real `needs:`
  # edge on it; `needs:` cannot cross workflow files. Gated identically
  # to `build` so a non-release push does not pay for a llama.cpp build
  # it will not use.
  llm-smoke:
    if: startsWith(github.event.head_commit.message, 'release') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/llm-smoke.yml

  # Computed ONCE, on one runner.
  #
  # This began life as a step inside `build`, which is a four-platform
  # matrix — so it ran four times, under GNU awk on Windows, mawk on Ubuntu
  # and BSD awk on macOS, and every one of those jobs hands its own result to
  # tauri-action, which rewrites the release body when it finishes. Four
  # implementations of the same text with last-writer-wins is the bug this
  # whole change exists to fix, in a subtler form: the notes a user reads
  # would depend on which runner was slowest. One job, one string.
  notes:
    if: startsWith(github.event.head_commit.message, 'release') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      # The release notes are the body of the release commit — the one place
      # the release skill already has the owner write them. tauri-action
      # puts this string on the GitHub release AND into `latest.json` as
      # `notes`, which the app shows after an update; editing the release
      # page afterwards never reaches that file, and every matrix job
      # rewrites the page's body when it finishes anyway. So the text has to
      # be right here, once, and be true of this release only.
      #
      # Three renderers read it line by line (GitHub, the website's
      # changelog, the app's what's-new dialog) and git wraps bodies at 72
      # columns, so wrapped lines are joined back into their bullet or
      # paragraph the way markdown would. Trailers are dropped. With no
      # body, the subject's summary (`release vX.Y.Z — summary`) becomes the
      # one bullet; with neither, the job stops here — before the build —
      # rather than publish filler to every user's updater.
      - name: Release notes from the commit message
        id: notes
        if: startsWith(github.event.head_commit.message, 'release')
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTES=$(printf '%s\n' "$COMMIT_MSG" | tail -n +2 | awk '
            function flush() { if (have) print buf; have = 0 }
            { sub(/\r$/, "") }
            tolower($0) ~ /^(co-authored-by|signed-off-by):/ { next }
            /^[ \t]*$/ { flush(); print ""; next }
            /^[ \t]*[-*] / { flush(); buf = $0; have = 1; next }
            { sub(/^[ \t]+/, ""); if (have) buf = buf " " $0; else { buf = $0; have = 1 } }
            END { flush() }
          ' | sed '/./,$!d')
          if [ -z "$NOTES" ]; then
            SUMMARY=$(printf '%s\n' "$COMMIT_MSG" | head -n 1 \
              | sed -E -e 's/^release[ \t]*v?[0-9]+\.[0-9]+\.[0-9]+[ \t]*(—|–|-|:)?[ \t]*//' \
                       -e 's/[ \t]*\[[^]]*\][ \t]*$//')
            if [ -n "$SUMMARY" ]; then NOTES="- $SUMMARY"; fi
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::No release notes. Put them in the release commit's body, or a summary after the version in its subject (release vX.Y.Z — summary)."
            exit 1
          fi
          printf 'Release notes:\n%s\n' "$NOTES"
          D="NOTES_EOF_$RANDOM$RANDOM"
          { echo "body<<$D"; printf '%s\n' "$NOTES"; echo "$D"; } >> "$GITHUB_OUTPUT"
  build:
    needs: [llm-smoke, notes]
    if: startsWith(github.event.head_commit.message, 'release') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `-- --features …` — tauri-action passes `args` through verbatim
          # to `<tauriScript> build`, and the Tauri CLI forwards everything
          # after `--` to cargo. ROADMAP §3: always try the GPU first;
          # llama.cpp falls back to the CPU at runtime, so one binary per
          # platform serves both GPU and GPU-less machines.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin -- --features coach-llm-metal'
            target: aarch64-apple-darwin
            label: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin -- --features coach-llm-metal'
            target: x86_64-apple-darwin
            label: macos-x86_64
          - platform: ubuntu-22.04
            args: '-- --features coach-llm-vulkan'
            target: ''
            label: ubuntu-22.04
          - platform: windows-latest
            args: '-- --features coach-llm-vulkan'
            target: ''
            label: windows

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      # cmake / Ninja / MSVC / Vulkan SDK — see the composite action.
      - name: LLM build environment
        uses: ./.github/actions/llm-build-env

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: 'v1-ninja-vk1.4.313'
          key: release-${{ matrix.label }}
          workspaces: 'src-tauri'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        shell: bash
        run: |
          npm install
          npx tauri --version || (npm install @tauri-apps/cli && npx tauri --version)

      - name: Extract version from commit message
        id: version
        if: startsWith(github.event.head_commit.message, 'release')
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "No version found in commit message"
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      # Pinned to a tag: `@dev` is a moving branch, and this job is the only
      # thing standing between a `release …` commit and a published binary.
      # `args` is forwarded verbatim to `npx tauri build`, so the matrix'
      # `-- --features …` reaches cargo (verified against the action source
      # at action-v1.0.0: inputs.rawArgs → runner.execTauriCommand).
      #
      # With no `tagName` the action builds and uploads workflow artifacts
      # without touching Releases, which is what a `workflow_dispatch` run
      # on a feature branch wants.
      - name: Build Tauri app (release)
        id: tauri
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Yames ${{ steps.version.outputs.tag }}'
          # From the release commit, computed once in the `notes` job.
          # Empty on a dispatch run, where there is no tag and so no release
          # to put it on.
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # Dispatch runs have no tag, so nothing is uploaded to Releases;
          # keep the bundles as workflow artifacts instead so the build is
          # still verifiable.
          uploadWorkflowArtifacts: ${{ steps.version.outputs.tag == '' }}

      # ROADMAP §5.0.1: binary growth budget ≤ 80 MB per platform, and the
      # actual numbers belong in the PR. `artifactPaths` is the action's own
      # list of what it produced.
      - name: Record bundle sizes
        if: always() && steps.tauri.outputs.artifactPaths
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -uo pipefail
          # `tee` so the numbers land in the step log too — the job summary
          # is not readable through the API.
          {
            echo "### Bundle sizes — ${{ matrix.label }}"
            echo
            echo '| Artifact | Size |'
            echo '|---|---:|'
            node -e '
            const fs = require("fs"), path = require("path");
            const du = (p) => {
              const st = fs.statSync(p);
              if (!st.isDirectory()) return st.size;
              return fs.readdirSync(p).reduce((n, e) => n + du(path.join(p, e)), 0);
            };
            for (const p of JSON.parse(process.env.ARTIFACT_PATHS)) {
              if (!fs.existsSync(p)) continue;
              const mib = (du(p) / 1048576).toFixed(1);
              console.log(`| \`${path.basename(p)}\` | ${mib} MiB |`);
            }
            '
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

  update-homebrew:
    needs: build
    if: startsWith(github.event.head_commit.message, 'release')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets
        run: sleep 30

      - name: Download DMGs and compute SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARM_URL="https://github.com/turutupa/yames/releases/download/v${VERSION}/Yames_${VERSION}_aarch64.dmg"
          INTEL_URL="https://github.com/turutupa/yames/releases/download/v${VERSION}/Yames_${VERSION}_x64.dmg"

          echo "Downloading ARM DMG..."
          curl -fSL -o arm.dmg "$ARM_URL" --retry 5 --retry-delay 10
          ARM_SHA=$(shasum -a 256 arm.dmg | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"

          echo "Downloading Intel DMG..."
          curl -fSL -o intel.dmg "$INTEL_URL" --retry 5 --retry-delay 10
          INTEL_SHA=$(shasum -a 256 intel.dmg | awk '{print $1}')
          echo "intel_sha=$INTEL_SHA" >> "$GITHUB_OUTPUT"

          echo "ARM SHA256: $ARM_SHA"
          echo "Intel SHA256: $INTEL_SHA"

      - name: Update cask formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARM_SHA: ${{ steps.sha.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.sha.outputs.intel_sha }}
        run: |
          cat > Casks/yames.rb << EOF
          cask "yames" do
            version "$VERSION"

            on_arm do
              url "https://github.com/turutupa/yames/releases/download/v#{version}/Yames_#{version}_aarch64.dmg"
              sha256 "$ARM_SHA"
            end

            on_intel do
              url "https://github.com/turutupa/yames/releases/download/v#{version}/Yames_#{version}_x64.dmg"
              sha256 "$INTEL_SHA"
            end

            name "Yames"
            desc "Yet Another Metronome Everyone Skips — musician-grade floating metronome"
            homepage "https://yames.app"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Yames.app"

            zap trash: [
              "~/Library/Application Support/com.yames.metronome",
              "~/Library/Caches/com.yames.metronome",
              "~/Library/Preferences/com.yames.metronome.plist",
            ]
          end
          EOF
          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Casks/yames.rb

      - name: Push cask to homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PAT: ${{ secrets.WINGET_PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/turutupa/homebrew-tap.git /tmp/homebrew-tap
          cp Casks/yames.rb /tmp/homebrew-tap/Casks/yames.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/yames.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update yames cask to v${VERSION}"
          git push

  update-winget:
    needs: build
    if: startsWith(github.event.head_commit.message, 'release')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version
        id: version
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets
        shell: bash
        run: sleep 30

      - name: Download EXE and compute SHA256
        id: sha
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $url = "https://github.com/turutupa/yames/releases/download/v$env:VERSION/Yames_${env:VERSION}_x64-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile installer.exe -MaximumRetryCount 5
          $hash = (Get-FileHash installer.exe -Algorithm SHA256).Hash
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Update winget manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          cat > winget/turutupa.yames.yaml << EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.singleton.1.12.0.schema.json
          PackageIdentifier: turutupa.yames
          PackageVersion: $VERSION
          PackageLocale: en-US
          Publisher: turutupa
          PublisherUrl: https://github.com/turutupa
          PackageName: Yames
          PackageUrl: https://yames.app
          License: GPL-3.0-or-later
          LicenseUrl: https://github.com/turutupa/yames/blob/main/LICENSE
          ShortDescription: Yet Another Metronome Everyone Skips — musician-grade floating metronome
          Description: |-
            A free, open-source desktop metronome with an always-on-top floating widget,
            sub-millisecond audio precision, zen mode with immersive visuals, drill practice mode,
            tap tempo, and 10 beautiful themes.
          Tags:
            - metronome
            - music
            - rhythm
            - practice
            - bpm
            - tempo
          Installers:
            - Architecture: x64
              InstallerType: nullsoft
              InstallerUrl: https://github.com/turutupa/yames/releases/download/v${VERSION}/Yames_${VERSION}_x64-setup.exe
              InstallerSha256: $SHA256
          ManifestType: singleton
          ManifestVersion: 1.12.0
          EOF
          sed -i 's/^          //' winget/turutupa.yames.yaml

      - name: Commit and push updated winget manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add winget/turutupa.yames.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update winget manifest to v${{ steps.version.outputs.version }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit PR to winget-pkgs
        continue-on-error: true
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $url = "https://github.com/turutupa/yames/releases/download/v$env:VERSION/Yames_${env:VERSION}_x64-setup.exe"
          .\wingetcreate.exe update turutupa.yames --version $env:VERSION --urls $url --submit --token $env:WINGET_PAT
