name: Android (unsigned build)

# Draft CI for the mobile Android track (plan §5, M05a). Deliberately
# workflow_dispatch-only: merging this file changes nothing on `main`
# or `mobile` until someone clicks "Run workflow". It does not touch
# `release.yml` (the desktop release, unaffected) or `ci.yml` (the
# desktop gate, unaffected).
#
# This produces an UNSIGNED debug-signed APK as a workflow artifact —
# good enough to sideload on a test device or hand to a closed
# tester, not good enough to upload to Google Play. Signing for a real
# Play upload is M05's job (see the commented keystore block below).
#
# PLACEHOLDER — M01 (plans/tasks/mobile/M01-rust-gates.md) has not
# merged into `mobile` yet. M01 decides how the mobile build excludes
# the practice-coach / coach-llm-* code: either a Cargo feature
# (`--no-default-features`) or target-specific dependency blocks with
# no extra flag at all. Update the "Build Android APK" step below once
# M01 lands — search this file for "M01 FLAG" to find the spot.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (defaults to the branch this is run from)'
        required: false
        type: string

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # M01's mobile gate uses the same four targets
      # (README.md "Mobile gates, from M01 on"). armv7 and i686/x86_64
      # cover older phones and emulators; aarch64 is what a real test
      # phone needs.
      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Provides ANDROID_HOME / ANDROID_SDK_ROOT and the sdkmanager/
      # cmdline-tools. NDK is installed as a separate step below because
      # the action does not pin one by default and the exact version
      # this crate needs is M00/M01's call (M00-android-spike.md
      # recommends "r26 or newer, side-by-side" — verify the pinned
      # version below still matches what M00's findings settled on).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # verify: pin to whatever NDK version M00/M01 actually built
      # against; this is a placeholder version, not a confirmed one.
      - name: Install Android NDK
        run: |
          sdkmanager --install "platforms;android-34" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      # `tauri android init` scaffolds src-tauri/gen/android. M00's brief
      # says to commit that directory once generated, so skip
      # regenerating it if a later merge already committed it.
      - name: Initialize Android project (if not already generated)
        env:
          YAMES_DEV_NO_LLM: '1'
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi

      # M01 FLAG — replace the placeholder comment below once M01 has
      # decided feature-vs-target gating (M01-rust-gates.md, "Feature vs
      # target gating"). If M01 lands on a Cargo feature, this needs
      # `-- --no-default-features` appended so the build excludes
      # practice-coach / coach-llm-* on Android; if M01 lands on
      # target-specific dependency blocks instead, no extra flag is
      # needed here at all and this comment should just be deleted.
      - name: Build Android APK (unsigned)
        env:
          YAMES_MOBILE: '1'
        run: |
          npx tauri android build --apk
          # M01 FLAG placeholder — see comment above. Example if a
          # Cargo feature is chosen:
          #   npx tauri android build --apk -- --no-default-features

      # Signing is M05's job. Play requires an upload key; keep Play App
      # Signing on and only the upload keystore in CI secrets (see
      # plans/tasks/mobile/PLAY-CONSOLE-CHECKLIST.md). Uncomment once
      # M05 adds the secrets to this repo and a signing step
      # (either `jarsigner`/`apksigner` here, or by pointing
      # `tauri.conf.json`'s android signing config at the secrets below
      # via env vars — check the Tauri v2 Android signing docs current
      # at M05 time, since this is unverified against a real config).
      #
      # - name: Decode signing keystore
      #   env:
      #     ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      #     ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      #     ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      #     ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      #   run: |
      #     echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
      #     # sign the AAB/APK tauri produced, then rm release.keystore

      - name: Find build outputs
        id: outputs
        run: |
          find src-tauri/gen/android -iname "*.apk" -o -iname "*.aab" 2>/dev/null || true

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: yames-android-unsigned
          path: |
            src-tauri/gen/android/**/*.apk
            src-tauri/gen/android/**/*.aab
          if-no-files-found: warn
          retention-days: 14
