<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>yames — Grouping Editor</title>
<style>
:root {
  --bg:          #0b0b16;
  --win:         #171724;
  --surface:     #1e1e30;
  --surface2:    #252538;
  --accent:      #e94560;
  --accent-glow: rgba(233,69,96,0.38);
  --text:        #eeeeee;
  --text2:       #666;
  --text3:       #3a3a55;
  --border:      rgba(255,255,255,0.06);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

.app-window {
  width: 580px;
  background: var(--win);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 48px 96px rgba(0,0,0,0.7);
  overflow: hidden;
}

/* ── Titlebar ── */
.titlebar {
  height: 42px;
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 14px;
}
.tbar-l { display: flex; align-items: center; gap: 10px; }
.tbar-r { display: flex; justify-content: flex-end; gap: 6px; }
.dots { display: flex; gap: 6px; }
.dot  { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: #ff5f57; }
.dot.y { background: #ffbd2e; }
.dot.g { background: #28c840; }
.save-btn {
  font-size: 11px; color: var(--text2);
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px; padding: 3px 10px;
  cursor: pointer; font-family: inherit;
}
.tabs { display: flex; gap: 2px; }
.tab {
  font-size: 12px; font-weight: 500;
  padding: 4px 14px; border-radius: 7px;
  border: 1px solid transparent;
  background: transparent; color: var(--text2);
  cursor: pointer; font-family: inherit;
}
.tab.active {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.1);
  color: var(--text);
}
.tbar-icon {
  width: 28px; height: 28px;
  border-radius: 7px; background: transparent;
  border: none; color: var(--text2);
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ── Content ── */
.content {
  padding: 20px 32px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* ── BPM ── */
.bpm-section {
  display: flex; flex-direction: column;
  align-items: center; gap: 6px; width: 100%;
}
.tap-btn {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 3px 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; color: var(--text2);
  cursor: pointer; font-family: inherit;
}
.bpm-row { display: flex; align-items: center; gap: 16px; }
.bpm-arrow {
  width: 40px; height: 40px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 9px; color: var(--text);
  font-size: 18px; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
}
.bpm-value {
  font-size: 52px; font-weight: 800;
  color: var(--text); line-height: 1;
  min-width: 80px; text-align: center;
}
.tempo-slider {
  width: 100%; height: 2px;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.08);
  border-radius: 2px; outline: none;
}
.tempo-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: #ccc; cursor: pointer;
}
.tempo-mark {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text2);
}

.divider {
  width: 100%; height: 1px;
  background: var(--border);
}

/* ═══════════════════════════════
   GROUPS SECTION
═══════════════════════════════ */
.groups-section {
  width: 100%;
  display: flex; flex-direction: column;
  align-items: center; gap: 12px;
}

.groups-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  min-height: 90px;
}

.group-block {
  position: relative;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
}

.group-inner {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 10px 10px;
  transition: border-color 200ms, box-shadow 200ms;
}

.group-block.active .group-inner {
  border-color: rgba(233,69,96,0.35);
  box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
}

.group-remove {
  position: absolute;
  top: -7px; right: -7px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text2);
  font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 150ms;
  font-family: inherit; line-height: 1;
}
.group-block:hover .group-remove { opacity: 1; }
.group-remove:hover { background: rgba(233,69,96,0.15); color: var(--accent); }

.grp-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text2); font-size: 14px;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 80ms, color 80ms; line-height: 1;
}
.grp-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

/* Beat dots row */
.beat-dots {
  display: flex; align-items: flex-start; gap: 5px;
}

/* Each beat slot = main dot + sub-dots stacked vertically */
.beat-slot {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
}

/* Main beat dot */
.beat-dot {
  border-radius: 50%;
  transition: all 120ms ease;
  flex-shrink: 0;
}
.beat-dot.first {
  width: 14px; height: 14px;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
}
.beat-dot.rest {
  width: 12px; height: 12px;
  background: rgba(255,255,255,0.18);
}
.beat-dot.playing {
  transform: scale(1.45);
}
.beat-dot.first.playing {
  box-shadow: 0 0 16px var(--accent-glow), 0 0 32px rgba(233,69,96,0.3);
}
.beat-dot.rest.playing {
  background: rgba(255,255,255,0.55);
}

/* Sub-dots row (shown below each main beat dot) */
.sub-dots-row {
  display: flex; gap: 2px;
  align-items: center; justify-content: center;
  min-height: 6px;
}
.sub-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  transition: all 100ms ease;
  flex-shrink: 0;
}
/* Active sub-dot during playback */
.sub-dot.playing {
  background: rgba(255,255,255,0.55);
  transform: scale(1.3);
}
/* Sub-dot in accent group */
.beat-slot.accent-group .sub-dot.playing {
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
}

.group-count {
  font-size: 10px; color: var(--text2); letter-spacing: 0.04em;
}

.add-group-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 8px 12px;
  background: transparent;
  border: 1px dashed rgba(255,255,255,0.12);
  border-radius: 12px; color: var(--text2);
  font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all 120ms;
  margin-bottom: 20px;
}
.add-group-btn:hover {
  border-color: rgba(255,255,255,0.25);
  color: var(--text);
  background: rgba(255,255,255,0.03);
}

/* Pattern info */
.pattern-info {
  display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap; justify-content: center;
}
.pattern-total {
  font-size: 12px; font-weight: 600; color: var(--text2);
}
.pattern-sep { color: var(--text3); font-size: 12px; }
.pattern-formula {
  font-size: 14px; font-weight: 700; color: var(--text);
  letter-spacing: 0.04em;
}
.pattern-clicks {
  font-size: 11px; color: var(--text2);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px; padding: 2px 10px;
}

/* Quick presets */
.presets-row {
  display: flex; gap: 5px;
  flex-wrap: wrap; justify-content: center;
}
.preset-chip {
  padding: 4px 11px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; color: var(--text2);
  font-size: 11px; cursor: pointer; font-family: inherit;
  transition: all 100ms;
}
.preset-chip:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.preset-chip.active {
  border-color: var(--accent); color: var(--accent);
  background: rgba(233,69,96,0.08);
}

/* ── Subdiv ── */
.subdiv-section {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.subdiv-header {
  display: flex; align-items: center;
  justify-content: space-between;
}
.subdiv-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text2);
}
.subdiv-explain {
  font-size: 11px; color: var(--text2);
  font-style: italic;
  transition: color 200ms;
}
.subdiv-pills {
  display: flex; gap: 6px;
}
.subdiv-pill {
  flex: 1;
  padding: 7px 0;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; color: var(--text2);
  font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all 100ms;
  text-align: center;
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
}
.subdiv-pill .pill-symbol { font-size: 14px; }
.subdiv-pill .pill-label  { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; }
.subdiv-pill:hover { border-color: rgba(255,255,255,0.18); color: var(--text); }
.subdiv-pill.active {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.18); color: var(--text);
}

/* ── Play button ── */
.play-btn {
  width: 100%; height: 46px;
  background: rgba(255,255,255,0.88);
  color: #111; font-size: 14px; font-weight: 700;
  border: none; border-radius: 11px;
  cursor: pointer; font-family: inherit; letter-spacing: 0.04em;
  transition: all 120ms;
}
.play-btn:hover { background: #fff; }
.play-btn.playing {
  background: rgba(233,69,96,0.1);
  color: var(--accent);
  border: 1px solid rgba(233,69,96,0.25);
}
</style>
</head>
<body>

<div class="app-window">
  <div class="titlebar">
    <div class="tbar-l">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <button class="save-btn">Save preset</button>
    </div>
    <div class="tabs">
      <button class="tab active">♩ Metronome</button>
      <button class="tab">⚡ Drill</button>
    </div>
    <div class="tbar-r"><button class="tbar-icon">⚙</button></div>
  </div>

  <div class="content">

    <!-- BPM -->
    <div class="bpm-section">
      <button class="tap-btn">TAP</button>
      <div class="bpm-row">
        <button class="bpm-arrow">−</button>
        <span class="bpm-value">80</span>
        <button class="bpm-arrow">+</button>
      </div>
      <input type="range" class="tempo-slider" min="20" max="300" value="80" />
      <div class="tempo-mark">Andantino</div>
    </div>

    <div class="divider"></div>

    <!-- Groups -->
    <div class="groups-section">
      <div class="groups-row" id="groupsRow"></div>

      <div class="pattern-info">
        <span class="pattern-total" id="patternTotal">7 beats</span>
        <span class="pattern-sep">·</span>
        <span class="pattern-formula" id="patternFormula">3 + 2 + 2</span>
        <span class="pattern-sep">·</span>
        <span class="pattern-clicks" id="patternClicks">7 clicks/bar</span>
      </div>

      <div class="presets-row" id="presetsRow">
        <button class="preset-chip" data-p="4">4/4</button>
        <button class="preset-chip" data-p="3">3/4</button>
        <button class="preset-chip" data-p="2,3">5/4</button>
        <button class="preset-chip" data-p="3,3">6/8</button>
        <button class="preset-chip active" data-p="3,2,2">7/8</button>
        <button class="preset-chip" data-p="3,3,2">8/8</button>
        <button class="preset-chip" data-p="2,2,2,3">9/8</button>
        <button class="preset-chip" data-p="3,3,3,3">12/8</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Subdivision -->
    <div class="subdiv-section">
      <div class="subdiv-header">
        <span class="subdiv-label">Subdivision</span>
        <span class="subdiv-explain" id="subdivExplain">1 click per beat</span>
      </div>
      <div class="subdiv-pills" id="subdivPills">
        <button class="subdiv-pill active" data-sub="1">
          <span class="pill-symbol">♩</span>
          <span class="pill-label">Quarter</span>
        </button>
        <button class="subdiv-pill" data-sub="2">
          <span class="pill-symbol">♪♪</span>
          <span class="pill-label">8th</span>
        </button>
        <button class="subdiv-pill" data-sub="3">
          <span class="pill-symbol">♩³</span>
          <span class="pill-label">Triplet</span>
        </button>
        <button class="subdiv-pill" data-sub="4">
          <span class="pill-symbol">♬</span>
          <span class="pill-label">16th</span>
        </button>
      </div>
    </div>

    <button class="play-btn" id="playBtn">▶ Play</button>

  </div>
</div>

<script>
/* ── State ── */
let groups      = [3, 2, 2];
let subdivision = 1;   // 1=quarter, 2=8th, 3=triplet, 4=16th
let playing     = false;
let curBeat     = -1;  // flat beat index (0 … totalBeats-1)
let curSub      = 0;   // sub-beat index (0 … subdivision-1)
let timer       = null;
const BPM       = 80;

const SUBDIV_LABELS = {
  1: '1 click per beat',
  2: '2 clicks per beat — divides each beat in 2',
  3: '3 clicks per beat — triplet feel',
  4: '4 clicks per beat — 16th note precision',
};

/* ── Helpers ── */
function totalBeats() { return groups.reduce((a, b) => a + b, 0); }
function totalClicks() { return totalBeats() * subdivision; }
function interval()    { return 60000 / (BPM * subdivision); }

function beatToGroupPos(flatIdx) {
  let rem = flatIdx;
  for (let g = 0; g < groups.length; g++) {
    if (rem < groups[g]) return { g, pos: rem };
    rem -= groups[g];
  }
  return { g: 0, pos: 0 };
}

function patternStr() { return groups.join(' + '); }

/* ── Render ── */
function render() {
  const row = document.getElementById('groupsRow');
  row.innerHTML = '';

  const { g: activeG, pos: activePos } = (curBeat >= 0)
    ? beatToGroupPos(curBeat) : { g: -1, pos: -1 };

  groups.forEach((count, gi) => {
    const block = document.createElement('div');
    block.className = 'group-block' + (gi === activeG ? ' active' : '');

    // remove btn
    const rmBtn = document.createElement('button');
    rmBtn.className = 'group-remove';
    rmBtn.textContent = '×';
    rmBtn.onclick = (e) => { e.stopPropagation(); removeGroup(gi); };

    const inner = document.createElement('div');
    inner.className = 'group-inner';

    // shrink
    const shrinkBtn = document.createElement('button');
    shrinkBtn.className = 'grp-btn';
    shrinkBtn.textContent = '−';
    shrinkBtn.onclick = () => shrinkGroup(gi);

    // dots
    const dotsWrap = document.createElement('div');
    dotsWrap.className = 'beat-dots';

    for (let b = 0; b < count; b++) {
      const isActiveBeat = gi === activeG && b === activePos;
      const isAccent = b === 0;

      const slot = document.createElement('div');
      slot.className = 'beat-slot' + (isAccent ? ' accent-group' : '');

      // main dot
      const dot = document.createElement('div');
      dot.className = 'beat-dot ' + (isAccent ? 'first' : 'rest')
                    + (isActiveBeat && curSub === 0 ? ' playing' : '');
      slot.appendChild(dot);

      // sub-dots (only when subdivision > 1)
      if (subdivision > 1) {
        const subRow = document.createElement('div');
        subRow.className = 'sub-dots-row';
        // sub-dots represent the clicks BETWEEN main beats (subdivision - 1)
        for (let s = 1; s < subdivision; s++) {
          const sd = document.createElement('div');
          const isActiveSub = isActiveBeat && curSub === s;
          sd.className = 'sub-dot' + (isActiveSub ? ' playing' : '');
          subRow.appendChild(sd);
        }
        slot.appendChild(subRow);
      }

      dotsWrap.appendChild(slot);
    }

    // grow
    const growBtn = document.createElement('button');
    growBtn.className = 'grp-btn';
    growBtn.textContent = '+';
    growBtn.onclick = () => growGroup(gi);

    inner.appendChild(shrinkBtn);
    inner.appendChild(dotsWrap);
    inner.appendChild(growBtn);

    // count label
    const label = document.createElement('div');
    label.className = 'group-count';
    label.textContent = count + (count === 1 ? ' beat' : ' beats');

    block.appendChild(rmBtn);
    block.appendChild(inner);
    block.appendChild(label);
    row.appendChild(block);
  });

  // add group button
  const addBtn = document.createElement('button');
  addBtn.className = 'add-group-btn';
  addBtn.textContent = '＋ group';
  addBtn.onclick = addGroup;
  row.appendChild(addBtn);

  // info
  document.getElementById('patternTotal').textContent  = totalBeats() + ' beats';
  document.getElementById('patternFormula').textContent = patternStr();
  document.getElementById('patternClicks').textContent  =
    totalClicks() + ' click' + (totalClicks() !== 1 ? 's' : '') + '/bar';

  // preset chips
  const cur = groups.join(',');
  document.querySelectorAll('.preset-chip').forEach(c =>
    c.classList.toggle('active', c.dataset.p === cur));
}

/* ── Group mutations ── */
function growGroup(gi)   { if (groups[gi] < 8) { groups[gi]++; render(); } }
function shrinkGroup(gi) { if (groups[gi] > 1) { groups[gi]--; render(); } else removeGroup(gi); }
function addGroup()      { if (groups.length < 8) { groups.push(2); render(); } }
function removeGroup(gi) {
  if (groups.length <= 1) return;
  groups.splice(gi, 1);
  if (curBeat >= totalBeats()) curBeat = 0;
  render();
}

/* ── Presets ── */
document.getElementById('presetsRow').addEventListener('click', e => {
  const chip = e.target.closest('.preset-chip');
  if (!chip) return;
  groups = chip.dataset.p.split(',').map(Number);
  curBeat = playing ? 0 : -1;
  curSub  = 0;
  render();
});

/* ── Subdivision ── */
document.getElementById('subdivPills').addEventListener('click', e => {
  const pill = e.target.closest('.subdiv-pill');
  if (!pill) return;
  subdivision = parseInt(pill.dataset.sub);
  document.querySelectorAll('.subdiv-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  document.getElementById('subdivExplain').textContent = SUBDIV_LABELS[subdivision];
  curSub = 0;
  if (playing) restartTimer();
  render();
});

/* ── Playback ── */
function tick() {
  curSub++;
  if (curSub >= subdivision) {
    curSub = 0;
    curBeat = (curBeat + 1) % totalBeats();
  }
  render();
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(tick, interval());
}

function restartTimer() {
  clearInterval(timer);
  startTimer();
}

document.getElementById('playBtn').addEventListener('click', function () {
  if (playing) {
    clearInterval(timer);
    playing = false;
    curBeat = -1; curSub = 0;
    this.textContent = '▶ Play';
    this.classList.remove('playing');
  } else {
    playing = true;
    curBeat = 0; curSub = 0;
    this.textContent = '⏹ Stop';
    this.classList.add('playing');
    startTimer();
  }
  render();
});

/* ── Init ── */
render();
</script>
</body>
</html>
