<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>yames — Grouping Editor</title>
<style>
:root {
  --bg:          #0b0b16;
  --win:         #171724;
  --surface:     #1e1e30;
  --surface2:    #252538;
  --accent:      #e94560;
  --accent-glow: rgba(233,69,96,0.38);
  --text:        #eeeeee;
  --text2:       #666;
  --text3:       #3a3a55;
  --border:      rgba(255,255,255,0.06);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  gap: 0;
}

/* ── Window ── */
.app-window {
  width: 560px;
  background: var(--win);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 48px 96px rgba(0,0,0,0.7);
  overflow: hidden;
}

/* ── Titlebar ── */
.titlebar {
  height: 42px;
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 14px;
}
.tbar-l { display: flex; align-items: center; gap: 10px; }
.tbar-r { display: flex; justify-content: flex-end; gap: 6px; }
.dots { display: flex; gap: 6px; }
.dot  { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: #ff5f57; }
.dot.y { background: #ffbd2e; }
.dot.g { background: #28c840; }
.save-btn {
  font-size: 11px; color: var(--text2);
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px; padding: 3px 10px;
  cursor: pointer; font-family: inherit;
}
.tabs { display: flex; gap: 2px; }
.tab {
  font-size: 12px; font-weight: 500;
  padding: 4px 14px; border-radius: 7px;
  border: 1px solid transparent;
  background: transparent; color: var(--text2);
  cursor: pointer; font-family: inherit;
}
.tab.active {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.1);
  color: var(--text);
}
.tbar-icon {
  width: 28px; height: 28px;
  border-radius: 7px; background: transparent;
  border: none; color: var(--text2);
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ── Content ── */
.content {
  padding: 20px 32px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

/* ── BPM ── */
.bpm-section {
  display: flex; flex-direction: column;
  align-items: center; gap: 6px; width: 100%;
}
.tap-btn {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 3px 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; color: var(--text2);
  cursor: pointer; font-family: inherit;
}
.bpm-row { display: flex; align-items: center; gap: 16px; }
.bpm-arrow {
  width: 40px; height: 40px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 9px; color: var(--text);
  font-size: 18px; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
}
.bpm-value {
  font-size: 52px; font-weight: 800;
  color: var(--text); line-height: 1;
  min-width: 80px; text-align: center;
}
.tempo-slider {
  width: 100%; height: 2px;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.08);
  border-radius: 2px; outline: none;
}
.tempo-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: #ccc; cursor: pointer;
}
.tempo-mark {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text2);
}

/* ── Divider ── */
.divider {
  width: 100%;
  height: 1px;
  background: var(--border);
}

/* ═══════════════════════════════════════
   GROUPING SECTION
═══════════════════════════════════════ */
.groups-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* Groups row: the blocks */
.groups-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  min-height: 82px;
}

/* Individual group block */
.group-block {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.group-inner {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 10px 10px;
  transition: border-color 200ms, box-shadow 200ms;
  position: relative;
}

.group-block.active .group-inner {
  border-color: rgba(233,69,96,0.35);
  box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
}

/* remove button — top right, on hover */
.group-remove {
  position: absolute;
  top: -7px; right: -7px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 150ms;
  font-family: inherit;
  line-height: 1;
}
.group-block:hover .group-remove { opacity: 1; }
.group-remove:hover { background: rgba(233,69,96,0.15); color: var(--accent); }

/* grow/shrink buttons */
.grp-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text2);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 80ms, color 80ms;
  line-height: 1;
}
.grp-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

/* beat dots inside a group */
.beat-dots {
  display: flex;
  align-items: center;
  gap: 5px;
}

.beat-dot {
  width: 13px; height: 13px;
  border-radius: 50%;
  transition: all 120ms ease;
  flex-shrink: 0;
}

.beat-dot.first {
  width: 15px; height: 15px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}

.beat-dot.rest {
  background: rgba(255,255,255,0.18);
}

/* when a dot is the current playing beat */
.beat-dot.playing {
  transform: scale(1.4);
}
.beat-dot.first.playing {
  box-shadow: 0 0 16px var(--accent-glow), 0 0 32px rgba(233,69,96,0.3);
}
.beat-dot.rest.playing {
  background: rgba(255,255,255,0.5);
}

/* group count label */
.group-count {
  font-size: 10px;
  color: var(--text2);
  letter-spacing: 0.04em;
}

/* "add group" button */
.add-group-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 12px;
  background: transparent;
  border: 1px dashed rgba(255,255,255,0.12);
  border-radius: 12px;
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 120ms;
  margin-bottom: 20px; /* align with group blocks + count label */
}
.add-group-btn:hover {
  border-color: rgba(255,255,255,0.25);
  color: var(--text);
  background: rgba(255,255,255,0.03);
}

/* Pattern info */
.pattern-info {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pattern-total {
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
}
.pattern-formula {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
}

/* Quick presets */
.presets-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
}
.preset-chip {
  padding: 4px 11px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all 100ms;
}
.preset-chip:hover {
  border-color: rgba(255,255,255,0.2);
  color: var(--text);
}
.preset-chip.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(233,69,96,0.08);
}

/* Subdiv */
.subdiv-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.subdiv-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text2);
}
.subdiv-pill {
  padding: 3px 10px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all 80ms;
}
.subdiv-pill.active {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.16);
  color: var(--text);
}

/* ── Play button ── */
.play-btn {
  width: 100%;
  height: 46px;
  background: rgba(255,255,255,0.88);
  color: #111;
  font-size: 14px; font-weight: 700;
  border: none; border-radius: 11px;
  cursor: pointer; font-family: inherit;
  letter-spacing: 0.04em;
  transition: all 120ms;
}
.play-btn:hover { background: #fff; }
.play-btn.playing {
  background: rgba(233,69,96,0.1);
  color: var(--accent);
  border: 1px solid rgba(233,69,96,0.25);
}
</style>
</head>
<body>

<div class="app-window">

  <!-- Titlebar -->
  <div class="titlebar">
    <div class="tbar-l">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <button class="save-btn">Save preset</button>
    </div>
    <div class="tabs">
      <button class="tab active">♩ Metronome</button>
      <button class="tab">⚡ Drill</button>
    </div>
    <div class="tbar-r">
      <button class="tbar-icon">⚙</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- BPM -->
    <div class="bpm-section">
      <button class="tap-btn">TAP</button>
      <div class="bpm-row">
        <button class="bpm-arrow">−</button>
        <span class="bpm-value">80</span>
        <button class="bpm-arrow">+</button>
      </div>
      <input type="range" class="tempo-slider" min="20" max="300" value="80" />
      <div class="tempo-mark">Andantino</div>
    </div>

    <div class="divider"></div>

    <!-- Groups -->
    <div class="groups-section">

      <div class="groups-row" id="groupsRow">
        <!-- rendered by JS -->
      </div>

      <!-- Pattern info -->
      <div class="pattern-info">
        <span class="pattern-total" id="patternTotal">7 beats</span>
        <span style="color:var(--text3)">·</span>
        <span class="pattern-formula" id="patternFormula">3 + 2 + 2</span>
      </div>

      <!-- Quick preset patterns -->
      <div class="presets-row" id="presetsRow">
        <button class="preset-chip" data-p="4">4/4</button>
        <button class="preset-chip" data-p="3">3/4</button>
        <button class="preset-chip" data-p="2,3">5/4</button>
        <button class="preset-chip" data-p="3,3">6/8</button>
        <button class="preset-chip active" data-p="3,2,2">7/8</button>
        <button class="preset-chip" data-p="3,3,2">8/8</button>
        <button class="preset-chip" data-p="2,2,2,3">9/8</button>
        <button class="preset-chip" data-p="3,3,3,3">12/8</button>
      </div>

      <!-- Subdiv -->
      <div class="subdiv-row">
        <span class="subdiv-label">Subdiv</span>
        <button class="subdiv-pill active">♩</button>
        <button class="subdiv-pill">♪♪</button>
        <button class="subdiv-pill">♪♪♪</button>
        <button class="subdiv-pill">♬</button>
      </div>

    </div>

    <div class="divider"></div>

    <!-- Play -->
    <button class="play-btn" id="playBtn">▶ Play</button>

  </div>
</div>

<script>
/* ─── State ─── */
let groups = [3, 2, 2]; // beat counts per group
let playing = false;
let currentBeat = -1; // flat beat index
let timer = null;
const BPM = 80;

/* ─── Derived ─── */
function totalBeats() { return groups.reduce((a, b) => a + b, 0); }

function beatToGroupPos(flatIdx) {
  let rem = flatIdx;
  for (let g = 0; g < groups.length; g++) {
    if (rem < groups[g]) return { g, pos: rem };
    rem -= groups[g];
  }
  return { g: 0, pos: 0 };
}

function patternStr() {
  return groups.join(' + ');
}

/* ─── Render ─── */
function render() {
  const row = document.getElementById('groupsRow');
  row.innerHTML = '';

  const { g: activeGroup, pos: activePos } = currentBeat >= 0
    ? beatToGroupPos(currentBeat)
    : { g: -1, pos: -1 };

  groups.forEach((count, gi) => {
    const block = document.createElement('div');
    block.className = 'group-block' + (gi === activeGroup ? ' active' : '');

    // remove button
    const removeBtn = document.createElement('button');
    removeBtn.className = 'group-remove';
    removeBtn.textContent = '×';
    removeBtn.title = 'Remove group';
    removeBtn.onclick = (e) => { e.stopPropagation(); removeGroup(gi); };

    const inner = document.createElement('div');
    inner.className = 'group-inner';

    // shrink button
    const shrinkBtn = document.createElement('button');
    shrinkBtn.className = 'grp-btn';
    shrinkBtn.textContent = '−';
    shrinkBtn.title = 'Remove a beat';
    shrinkBtn.onclick = () => shrinkGroup(gi);

    // dots
    const dotsWrap = document.createElement('div');
    dotsWrap.className = 'beat-dots';

    for (let b = 0; b < count; b++) {
      const dot = document.createElement('div');
      const isActive = gi === activeGroup && b === activePos;
      dot.className = 'beat-dot ' + (b === 0 ? 'first' : 'rest') + (isActive ? ' playing' : '');
      dotsWrap.appendChild(dot);
    }

    // grow button
    const growBtn = document.createElement('button');
    growBtn.className = 'grp-btn';
    growBtn.textContent = '+';
    growBtn.title = 'Add a beat';
    growBtn.onclick = () => growGroup(gi);

    inner.appendChild(shrinkBtn);
    inner.appendChild(dotsWrap);
    inner.appendChild(growBtn);

    // count label
    const countLabel = document.createElement('div');
    countLabel.className = 'group-count';
    countLabel.textContent = count + (count === 1 ? ' beat' : ' beats');

    block.appendChild(removeBtn);
    block.appendChild(inner);
    block.appendChild(countLabel);
    row.appendChild(block);
  });

  // add group button
  const addBtn = document.createElement('button');
  addBtn.className = 'add-group-btn';
  addBtn.innerHTML = '＋ group';
  addBtn.onclick = addGroup;
  row.appendChild(addBtn);

  // update info
  document.getElementById('patternTotal').textContent = totalBeats() + ' beats';
  document.getElementById('patternFormula').textContent = patternStr();

  // update preset chips
  const currentPattern = groups.join(',');
  document.querySelectorAll('.preset-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.p === currentPattern);
  });
}

/* ─── Mutations ─── */
function growGroup(gi) {
  if (groups[gi] < 8) groups[gi]++;
  render();
}

function shrinkGroup(gi) {
  if (groups[gi] > 1) groups[gi]--;
  else removeGroup(gi);
}

function removeGroup(gi) {
  if (groups.length <= 1) return;
  groups.splice(gi, 1);
  if (currentBeat >= totalBeats()) currentBeat = 0;
  render();
}

function addGroup() {
  groups.push(2);
  render();
}

/* ─── Presets ─── */
document.getElementById('presetsRow').addEventListener('click', (e) => {
  const chip = e.target.closest('.preset-chip');
  if (!chip) return;
  groups = chip.dataset.p.split(',').map(Number);
  currentBeat = playing ? 0 : -1;
  render();
});

/* ─── Playback ─── */
document.getElementById('playBtn').addEventListener('click', function () {
  if (playing) {
    clearInterval(timer);
    playing = false;
    currentBeat = -1;
    this.textContent = '▶ Play';
    this.classList.remove('playing');
  } else {
    playing = true;
    currentBeat = 0;
    this.textContent = '⏹ Stop';
    this.classList.add('playing');
    timer = setInterval(() => {
      currentBeat = (currentBeat + 1) % totalBeats();
      render();
    }, 60000 / BPM);
  }
  render();
});

/* ─── Subdiv pills ─── */
document.querySelectorAll('.subdiv-pill').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.subdiv-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
});

/* ─── Init ─── */
render();
</script>
</body>
</html>
