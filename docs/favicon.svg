<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yames">
  <defs>
    <!-- Brand amber. A filled colour block reads at 16px and stands out
         in a tab strip where almost every other icon is dark. -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse"
                    x1="6" y1="0" x2="58" y2="64">
      <stop offset="0%" stop-color="#FFC24D"/>
      <stop offset="100%" stop-color="#E8760C"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- The Y is knocked through the tile in ink rather than left
       transparent, so it reads the same on light and dark chrome.
       It doubles as a metronome pendulum: fork is the swing, stem is
       the rod. -->
  <g fill="none" stroke="#0B0A14" stroke-width="8"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 17 L32 37 L46 17"/>
    <path d="M32 37 L32 48"/>
  </g>
</svg>
