pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
    }
}

// Only used when this library is opened on its own. In an app build the Tauri
// CLI writes `gen/android/tauri.settings.gradle`, which includes both
// `:tauri-android` and this project, and Gradle ignores a subproject's own
// settings file.
include ':tauri-android'
project(':tauri-android').projectDir = new File('./.tauri/tauri-api')
