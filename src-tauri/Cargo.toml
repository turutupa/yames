[package]
name = "yames"
version = "1.2.2"
description = "Yet Another Metronome Everyone Skips — practice metronome with MIDI control, speed drills, and AI coach"
authors = ["you"]
license = "GPL-3.0-or-later"
edition = "2021"
# Tauri's `beforeDevCommand` shells out to `cargo run` with no `--bin`
# flag. As soon as a second binary lives under `src/bin/` (we added
# `dump-fixture` for the DSP fixture pipeline), Cargo refuses to pick a
# default and `tauri dev` fails with:
#   error: `cargo run` could not determine which binary to run.
#   available binaries: dump-fixture, yames
# `default-run` tells Cargo which binary `cargo run` (no `--bin`) should
# launch — the desktop app — so `tauri dev` keeps booting the shell.
default-run = "yames"

[lib]
name = "yames_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is W21's: the review plays a take's picture, and a webview
# can only decode video from a URL it is allowed to fetch. The asset protocol
# is scoped in `tauri.conf.json` to `$APPDATA/takes/**` and to nothing else, so
# what it opens is exactly the directory the player can already see, play and
# delete through the app. The feature and the scope have to agree or the build
# script refuses, which is how this line came to be here.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
cpal = "0.15"
# The native folder picker behind `pick_kit_folder` — a kit of your own
# samples is a folder you point the app at (plans/JAM_UX_DECISIONS.md B3),
# and only the OS can draw that dialog. Apache-2.0 OR MIT, like Tauri
# itself, so it changes nothing about what this app may ship.
tauri-plugin-dialog = "2"
# WAV decoding for those folders. Already in the graph under rodio, which
# is why this adds no package to Cargo.lock — declared directly because
# rodio's own decoder narrows every file to i16 and PANICS on a spec it
# does not implement, and a file the user chose must be REFUSED with a
# message, never crash the command. Apache-2.0.
hound = "3"
# The General MIDI synthesiser behind Songs (W28). Pure Rust, MIT, and no
# dependencies at all beyond std — so it adds one package to Cargo.lock and
# nothing to the build toolchain, which matters on a crate that already needs
# cmake for aubio. It renders on a thread of our own, never on the audio
# callback: `src/synth.rs` says why and what stands between them.
rustysynth = "1.3.6"
# Tauri already pulls tokio in transitively; declared explicitly so we can
# use `tokio::task::spawn_blocking` from blocking command handlers.
tokio = { version = "1", features = ["rt"] }
# aubio — GPL-2+ MIR library for onset detection. The `static` feature
# bundles the C source via aubio-sys (cmake required at build time) so
# there is no runtime .dylib dependency. Requires cmake; on macOS:
#   brew install cmake
# On Linux: apt-get install cmake
# The crate name on crates.io is `aubio` (v0.2.*).
aubio = { version = "0.2", features = ["static", "bindgen"] }

audio_thread_priority = { version = "0.37.0", default-features = false }
# FLAC, for the shipped sound bank only. Nine minutes of audio was 70 MB as
# uncompressed WAV and is 31 MB as FLAC, bit for bit the same samples — see
# `kit.rs`. Chosen over symphonia and rodio's decoders for the same reason
# `hound` was: it is a small pure-Rust decoder that returns `Result` on a
# file it cannot read instead of panicking, and nothing in `kit.rs` may
# panic on a file a musician chose. Apache-2.0.
claxon = "0.4.3"
# The practice store (ROADMAP 1.1). `bundled` compiles SQLite from the
# amalgamation shipped inside libsqlite3-sys, so the app never depends on
# whatever sqlite3 the machine happens to have — a metronome that loses a
# year of practice because a system library moved is not a coach. SQLite
# itself is public domain and rusqlite is MIT, so neither touches the
# GPL-3 promise in ROADMAP §1 principle 5.
rusqlite = { version = "0.37", features = ["bundled"] }
# Base64, for the two places bytes cross the IPC boundary: the file a caught
# download is read from (`downloads.rs`) and the copy of it the store kept,
# on its way back out to a save dialog (`export_score_source`). Tauri
# serialises a `Vec<u8>` as a JSON array of decimal numbers, so a megabyte of
# Guitar Pro would cross as a million integers; base64 is the shape
# `scores.source_b64` is already in on the other side. Already in the graph
# under tauri itself, so this adds NO package to Cargo.lock and NOTHING to
# the installer. MIT OR Apache-2.0.
base64 = "0.22"

[features]
default = []
# CPU-only inference. Development machines and the CI fallback; also what
# `cargo test --features coach-llm --lib` exercises.
coach-llm = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:num_cpus"]
# Shipping features, one GPU backend per platform (ROADMAP §3: always try
# the GPU first). llama.cpp falls back to CPU at runtime when no usable
# device/driver is present, so a single binary serves both cases.
coach-llm-metal = ["coach-llm", "llama-cpp-2/metal"]
coach-llm-vulkan = ["coach-llm", "llama-cpp-2/vulkan"]
# The in-app click probe's allocation count (`src/app_probe.rs`): installs a
# counting `#[global_allocator]` in the app binary. For `tests/e2e` only,
# never for a build anyone plays on. The probe itself is armed at run time by
# `YAMES_CALLBACK_PROBE=1`, with or without this.
callback-probe-alloc = []

# ---------------------------------------------------------------------------
# Desktop only (MOBILE_IMPLEMENTATION_PLAN §3, revised for the MVP by M7).
#
# What a phone cannot build or has no use for: the window manager's plugins,
# MIDI (midir 0.10 has no Android backend at all), one-instance-at-a-time, and
# the coach's LLM. A target block rather than a Cargo feature because the Tauri
# CLI has no `--no-default-features`, so nothing has to be remembered on a
# phone build. Cargo never evaluates this block for `aarch64-linux-android`.
#
# What is NOT here any more, unlike the mobile v1 branch: aubio and the whole
# mic evaluation. The revamp grades a Session from the guitar, so a phone
# needs the same onset detector, timing analyzer and scorer as a desktop
# (plans/tasks/mvp/ANDROID.md). `tauri` stays in `[dependencies]` with its
# features: tauri-build reads only that table for its allowlist check, and
# `macos-private-api` / `tray-icon` are inert off their platforms.
# ---------------------------------------------------------------------------
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-decorum = "1"
midir = "0.10"
# One Yames at a time, so that double-clicking a Guitar Pro file while the app
# is already open hands the path to the running window instead of starting a
# second copy — which would fight the first for the audio device and the
# settings store. Apache-2.0 OR MIT, like Tauri itself.
#
# What it costs, per platform, because it is NOT the same on all three:
# on Windows a named mutex plus a hidden window and WM_COPYDATA, over
# `windows-sys`, which is already in this graph — a few kilobytes. On macOS
# it is close to nothing; LaunchServices already forwards a second launch to
# the running app. On LINUX it talks over D-Bus, and that pulls `zbus` and
# its async stack: **thirty packages into Cargo.lock**, all of them behind
# `cfg(target_os = "linux")` so nothing but the Linux build compiles them.
# The lock file grew by thirty-one entries; the Windows and macOS binaries
# did not.
tauri-plugin-single-instance = "2"

# LLM inference for Practice Coach (requires cmake + a C/C++ toolchain to
# build). Deliberately carries NO backend feature here: `metal` is a
# macOS-only backend, and hardcoding it made `--features coach-llm`
# unbuildable on Windows and Linux. The backend is chosen by the Yames
# feature that turns this dependency on — see [features] below.
llama-cpp-2 = { version = "0.1.146", optional = true }
# Detokenisation of LLM output. `LlamaModel::token_to_piece` takes an
# `encoding_rs::Decoder` and llama-cpp-2 does not re-export the crate, so it
# has to be a direct dependency. Already in the graph underneath
# llama-cpp-2, so this adds no package to Cargo.lock.
encoding_rs = { version = "0.8", optional = true }
# Physical-core count for the inference thread budget (ROADMAP §3:
# `n_threads = max(1, physical_cores - 2)`). std only exposes *logical*
# CPUs; halving them as an SMT proxy under-counts by 2x on every machine
# without hyper-threading (an 8-core M1 got 2 threads). Optional so a
# default build does not pay for it.
num_cpus = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation-sys = "0.8"

# ---------------------------------------------------------------------------
# Android only.
#
# `oboe` is already in the graph — cpal 0.15 pulls it in as its Android audio
# backend, with the same "0.6" requirement and the same `java-interface`
# feature — so naming it here adds no package to Cargo.lock. cpal's Oboe
# backend never asks for `PerformanceMode::LowLatency`, opens 44.1 kHz into a
# 48 kHz device and sets no input preset (so the platform's AGC and noise
# suppression would flatten every pick attack), so `src/android_audio.rs`
# opens the output stream and `src/android_input.rs` the input stream itself.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
oboe = { version = "0.6", features = ["java-interface"] }
# The things a webview cannot do on Android: keep playing with the screen off
# (a foreground service), yield to a phone call (audio focus), keep the screen
# awake, answer the Back gesture, open a link, and ask for the microphone.
tauri-plugin-yames-mobile = { path = "plugins/yames-mobile" }

# iPhone: the same plugin crate, with a Swift half (M06a). Not an MVP target.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-yames-mobile = { path = "plugins/yames-mobile" }

# Thread-priority control for the LLM inference worker (ROADMAP §3: the
# generation thread runs *below normal* so it can never starve the audio
# path) and the total-RAM query behind the Studio tier gate (§3: Studio is
# only offered at >= 16 GB). Both crates are already in the dependency
# graph transitively, so declaring them adds no new downloads.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }
# W21 — the camera's permission prompt on Windows.
#
# WebView2 asks for a camera the way a browser does: its own bar, per origin,
# and by default it asks again next time. Yames has already asked, in its own
# words, in a dialog the player answered before `getUserMedia` was ever called
# (`CameraIntroDialog`), so a second prompt from the webview is the app asking
# twice and looking like a web page while it does it.
#
# Both crates are ALREADY in Cargo.lock underneath wry at exactly these
# versions, so declaring them adds no download and no new package — and pinning
# the same minors is what keeps the COM types identical to the ones
# `PlatformWebview::controller()` hands over. MIT/Apache-2.0, like Tauri.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# No external test deps yet — using Rust's built-in test harness.
# Add here when needed (e.g. `pretty_assertions`, `proptest`).

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
