[package]
name = "yames"
version = "1.1.0"
description = "Yet Another Metronome Everyone Skips — practice metronome with MIDI control, speed drills, and AI coach"
authors = ["you"]
license = "GPL-3.0-or-later"
edition = "2021"
# Tauri's `beforeDevCommand` shells out to `cargo run` with no `--bin`
# flag. As soon as a second binary lives under `src/bin/` (we added
# `dump-fixture` for the DSP fixture pipeline), Cargo refuses to pick a
# default and `tauri dev` fails with:
#   error: `cargo run` could not determine which binary to run.
#   available binaries: dump-fixture, yames
# `default-run` tells Cargo which binary `cargo run` (no `--bin`) should
# launch — the desktop app — so `tauri dev` keeps booting the shell.
default-run = "yames"

[lib]
name = "yames_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---------------------------------------------------------------------------
# What every platform compiles.
#
# MOBILE_IMPLEMENTATION_PLAN §3: the practice coach, the mic evaluation and
# the voice are *not compiled* into a mobile binary. The gate is the
# `[target.'cfg(not(any(target_os = "android", target_os = "ios")))'
# .dependencies]` block further down rather than a Cargo feature, because the
# Tauri CLI (2.10.x) has no `--no-default-features` flag on any subcommand —
# `tauri android build` could not have turned a default feature off. Making
# the dependency itself target-conditional needs no flag, and so cannot be
# forgotten. See `src/lib.rs` for the matching module map.
# ---------------------------------------------------------------------------
[dependencies]
# `tauri` itself stays here, features and all, and is deliberately NOT split
# into the desktop block below. tauri-build's allowlist check
# (tauri-build-2.5.6 `manifest.rs::find_dependency`) looks for `tauri` in
# `[dependencies]` first and, finding it, never reads the target blocks — so a
# split entry makes every desktop build fail with "add the `macos-private-api`
# feature". Both features are inert off their platform (`macos-private-api`
# forwards to macOS-only code; tauri declares the `tray-icon` crate under its
# own desktop-only target block), so carrying them on a phone costs nothing.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
cpal = "0.15"
# Tauri already pulls tokio in transitively; declared explicitly so we can
# use `tokio::task::spawn_blocking` from blocking command handlers.
tokio = { version = "1", features = ["rt"] }

audio_thread_priority = { version = "0.37.0", default-features = false }

[features]
default = []
# CPU-only inference. Development machines and the CI fallback; also what
# `cargo test --features coach-llm --lib` exercises.
coach-llm = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:num_cpus"]
# Shipping features, one GPU backend per platform (ROADMAP §3: always try
# the GPU first). llama.cpp falls back to CPU at runtime when no usable
# device/driver is present, so a single binary serves both cases.
coach-llm-metal = ["coach-llm", "llama-cpp-2/metal"]
coach-llm-vulkan = ["coach-llm", "llama-cpp-2/vulkan"]


# ---------------------------------------------------------------------------
# Desktop only — the coach, the mic evaluation, the voice, the window manager.
#
# Everything here is unreachable from a mobile binary by construction: a phone
# has one fullscreen webview and no window manager, and aubio (GPL-2+, C) +
# llama.cpp are the two things the owner ruled out of a phone build outright
# (plan §1). Cargo does not evaluate this block for `--target
# aarch64-linux-android` / `aarch64-apple-ios`, so no NDK and no cmake are
# needed to build for a phone.
#
# `tauri` is not here — see the note on it in `[dependencies]`.
# ---------------------------------------------------------------------------
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-decorum = "1"
# midir. The plan (§3.3) expected this to compile on Android to a dummy
# backend and stay in the mobile graph; it does not. midir 0.10.4's
# `src/backend/mod.rs` selects a backend by `target_os` and has no arm for
# `android` at all, so `backend` is empty and `common.rs` fails with
# `unresolved imports backend::MidiInput, …`. There is nothing to gate around
# it — the crate simply cannot be built for Android — so it leaves the mobile
# graph entirely, along with `src/midi.rs`. midir *does* have a CoreMIDI arm
# for `target_os = "ios"`; M07 (iOS Bluetooth MIDI, v1.1) turns this into
# `cfg(not(target_os = "android"))` and un-gates the iOS half.
midir = "0.10"
# aubio — GPL-2+ MIR library for onset detection. The `static` feature
# bundles the C source via aubio-sys (cmake required at build time) so
# there is no runtime .dylib dependency. Requires cmake; on macOS:
#   brew install cmake
# On Linux: apt-get install cmake
# The crate name on crates.io is `aubio` (v0.2.*).
aubio = { version = "0.2", features = ["static", "bindgen"] }

# LLM inference for Practice Coach (requires cmake + a C/C++ toolchain to
# build). Deliberately carries NO backend feature here: `metal` is a
# macOS-only backend, and hardcoding it made `--features coach-llm`
# unbuildable on Windows and Linux. The backend is chosen by the Yames
# feature that turns this dependency on — see [features] below.
llama-cpp-2 = { version = "0.1.146", optional = true }
# Detokenisation of LLM output. `LlamaModel::token_to_piece` takes an
# `encoding_rs::Decoder` and llama-cpp-2 does not re-export the crate, so it
# has to be a direct dependency. Already in the graph underneath
# llama-cpp-2, so this adds no package to Cargo.lock.
encoding_rs = { version = "0.8", optional = true }

# Physical-core count for the inference thread budget (ROADMAP §3:
# `n_threads = max(1, physical_cores - 2)`). std only exposes *logical*
# CPUs; halving them as an SMT proxy under-counts by 2x on every machine
# without hyper-threading (an 8-core M1 got 2 threads). Optional so a
# default build does not pay for it.
num_cpus = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation-sys = "0.8"

# ---------------------------------------------------------------------------
# Android only.
#
# `oboe` is already in the graph — cpal 0.15 pulls it in as its Android audio
# backend, with the same "0.6" requirement and the same `java-interface`
# feature — so naming it here adds no package to Cargo.lock and no second copy
# of the Oboe C++ sources. What it adds is the ability to *call* it, which
# M00 showed is necessary: cpal's Oboe backend never asks for
# `PerformanceMode::LowLatency` and opens 44.1 kHz into a 48 kHz device, so
# `src/android_audio.rs` builds the output stream itself. See that file.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
oboe = { version = "0.6", features = ["java-interface"] }
# The five things a webview cannot do on Android: keep playing with the screen
# off (a `mediaPlayback` foreground service), yield to a phone call (audio
# focus), keep the screen awake, answer the Back gesture without dying, and
# open a link. In-tree because none of it is reusable outside Yames and all of
# it is one screen of Kotlin.
tauri-plugin-yames-mobile = { path = "plugins/yames-mobile" }

# ---------------------------------------------------------------------------
# iPhone only (M06a).
#
# The same plugin crate as Android, with a Swift half instead of a Kotlin one
# (`plugins/yames-mobile/ios/`): the `AVAudioSession` that makes the click
# survive a locked screen and ignore the silent switch, the idle-timer hold,
# and `UIApplication.open` for the About links. Same five commands, same
# `audio_interrupted` event, so the frontend never branches on which phone it
# is running on.
#
# No `oboe` line here: iOS keeps cpal's CoreAudio backend, which honours the
# audio session's preferred buffer duration and sample rate, so there is
# nothing for a hand-written stream to fix. And no `midir`: CoreMIDI on the
# iPhone is M07, not v1.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-yames-mobile = { path = "plugins/yames-mobile" }

# Thread-priority control for the LLM inference worker (ROADMAP §3: the
# generation thread runs *below normal* so it can never starve the audio
# path) and the total-RAM query behind the Studio tier gate (§3: Studio is
# only offered at >= 16 GB). Both crates are already in the dependency
# graph transitively, so declaring them adds no new downloads.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# No external test deps yet — using Rust's built-in test harness.
# Add here when needed (e.g. `pretty_assertions`, `proptest`).

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
