<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>yames — Beat Redesign</title>
<style>
:root {
  --bg:           #0d0d18;
  --bg2:          #1a1a2e;
  --bg3:          #16213e;
  --surface:      #1e2438;
  --accent:       #e94560;
  --accent-glow:  rgba(233,69,96,0.35);
  --accent-dim:   rgba(233,69,96,0.5);
  --text:         #eeeeee;
  --text2:        #777;
  --border:       rgba(255,255,255,0.07);
  --radius:       12px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 36px 24px 56px;
  gap: 20px;
}

.page-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text2);
}

.hint {
  font-size: 12px;
  color: var(--text2);
  opacity: 0.65;
}

.options-row {
  display: flex;
  flex-direction: column;
  gap: 44px;
  align-items: center;
  margin-top: 8px;
  width: 100%;
}

.option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.option-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}

/* ── Window chrome ── */
.app-window {
  width: 520px;
  background: var(--bg2);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 40px 80px rgba(0,0,0,0.7), 0 0 0 0.5px rgba(255,255,255,0.04);
}

.titlebar {
  height: 42px;
  background: rgba(0,0,0,0.25);
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 14px;
}

.tbar-left  { display: flex; align-items: center; gap: 10px; }
.tbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }

.dots { display: flex; gap: 6px; }
.dot  { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: #ff5f57; }
.dot.y { background: #ffbd2e; }
.dot.g { background: #28c840; }

.tbar-save {
  font-size: 11px;
  color: var(--text2);
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  padding: 3px 10px;
  cursor: pointer;
  font-family: inherit;
}

.tabs {
  display: flex;
  gap: 2px;
}
.tab {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 14px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.tab.active {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.1);
  color: var(--text);
}

.tbar-icon {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 7px;
  background: transparent;
  border: none;
  color: var(--text2);
  font-size: 14px;
  cursor: pointer;
}

/* ── Content area ── */
.content {
  padding: 22px 36px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

/* ── BPM section (shared) ── */
.bpm-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.tap-btn {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  padding: 4px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  color: var(--text2);
  cursor: pointer;
  font-family: inherit;
}

.bpm-row {
  display: flex;
  align-items: center;
  gap: 18px;
}

.bpm-arrow {
  width: 42px; height: 42px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
}

.bpm-value {
  font-size: 54px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
  min-width: 84px;
  text-align: center;
}

.tempo-slider {
  width: 100%;
  height: 3px;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  outline: none;
}
.tempo-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #ddd;
  cursor: pointer;
}

.tempo-mark {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text2);
}

/* ── Play button ── */
.play-btn {
  width: 100%;
  height: 48px;
  background: rgba(255,255,255,0.88);
  color: #111;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.04em;
  transition: all 120ms;
}
.play-btn:hover { background: #fff; }
.play-btn.is-playing {
  background: rgba(233,69,96,0.12);
  color: var(--accent);
  border: 1px solid rgba(233,69,96,0.3);
}

/* ── Beat controls shared ── */
.beat-controls {
  display: flex;
  align-items: center;
  gap: 16px;
}

.count-stepper {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.count-btn {
  width: 30px; height: 28px;
  background: transparent;
  border: none;
  color: var(--text2);
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  transition: background 80ms;
}
.count-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.count-val {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  padding: 0 10px;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  line-height: 28px;
  min-width: 56px;
  text-align: center;
}

.subdiv-pills {
  display: flex;
  gap: 4px;
  align-items: center;
}
.subdiv-pill {
  padding: 3px 9px;
  border-radius: 6px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all 80ms;
}
.subdiv-pill.active {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.18);
  color: var(--text);
}
.subdiv-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text2);
}


/* ══════════════════════════════════════
   OPTION A — AMPLITUDE BARS
══════════════════════════════════════ */

.bars-stage {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.bars-wrap {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  height: 96px; /* fixed stage height */
}

.bar-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  cursor: pointer;
  /* full stage height is the click target */
  height: 96px;
  justify-content: flex-end;
  padding-bottom: 0;
  position: relative;
}
.bar-slot:hover .bar { filter: brightness(1.2); }

.bar {
  width: 38px;
  border-radius: 5px 5px 3px 3px;
  transition: height 140ms cubic-bezier(.4,0,.2,1),
              background 140ms ease,
              box-shadow 140ms ease;
  position: relative;
}

/* State 0 = accent */
.bar[data-s="0"] {
  height: 88px;
  background: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow), 0 0 32px rgba(233,69,96,0.18);
}
/* State 1 = normal */
.bar[data-s="1"] {
  height: 50px;
  background: rgba(255,255,255,0.22);
  box-shadow: none;
}
/* State 2 = silent */
.bar[data-s="2"] {
  height: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px dashed rgba(255,255,255,0.15);
  box-shadow: none;
}

/* playback highlight */
.bar.lit[data-s="0"] { box-shadow: 0 0 24px var(--accent-glow), 0 0 48px rgba(233,69,96,0.3); filter: brightness(1.3); }
.bar.lit[data-s="1"] { background: rgba(255,255,255,0.45); }
.bar.lit[data-s="2"] { background: rgba(255,255,255,0.12); }

.bar-n {
  font-size: 10px;
  color: rgba(255,255,255,0.2);
  margin-top: 6px;
  user-select: none;
  position: absolute;
  bottom: -18px;
}

.bars-nums {
  display: flex;
  gap: 7px;
  margin-top: 4px;
}
.bars-nums span {
  width: 38px;
  text-align: center;
  font-size: 10px;
  color: rgba(255,255,255,0.18);
  user-select: none;
}


/* ══════════════════════════════════════
   OPTION B — EXPRESSIVE CELLS
══════════════════════════════════════ */

.cells-stage {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.cells-wrap {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.cell-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.cell-slot:hover .cell { filter: brightness(1.15); }

.cell {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
  transition: all 140ms cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
}

/* State 0 = accent */
.cell[data-s="0"] {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 18px var(--accent-glow), 0 0 36px rgba(233,69,96,0.2);
}
/* State 1 = normal */
.cell[data-s="1"] {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.14);
  box-shadow: none;
}
/* State 2 = silent */
.cell[data-s="2"] {
  background: transparent;
  border-color: rgba(255,255,255,0.08);
  border-style: dashed;
  box-shadow: none;
}

/* playback */
.cell.lit {
  transform: scale(1.12);
}
.cell.lit[data-s="0"] { box-shadow: 0 0 28px var(--accent-glow), 0 0 56px rgba(233,69,96,0.28); filter: brightness(1.25); }
.cell.lit[data-s="1"] { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.3); }
.cell.lit[data-s="2"] { background: rgba(255,255,255,0.06); }

/* tiny sub-dots inside cell */
.cell-subdots {
  display: flex;
  gap: 3px;
}
.cell-subdot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
}
.cell[data-s="0"] .cell-subdot { background: rgba(255,255,255,0.6); }
.cell[data-s="2"] .cell-subdot { background: rgba(255,255,255,0.1); }

/* main beat mark inside cell */
.cell-mark {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
  transition: all 140ms;
}
.cell[data-s="0"] .cell-mark { background: rgba(255,255,255,0.95); width: 12px; height: 12px; }
.cell[data-s="1"] .cell-mark { background: rgba(255,255,255,0.45); }
.cell[data-s="2"] .cell-mark { background: transparent; border: 1.5px dashed rgba(255,255,255,0.2); }

.cell-n {
  font-size: 10px;
  color: rgba(255,255,255,0.18);
  user-select: none;
}

/* ── Legend ── */
.legend {
  display: flex;
  gap: 14px;
  justify-content: center;
}
.leg-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text2);
}
.leg-sw {
  width: 12px; height: 12px; border-radius: 3px;
}
</style>
</head>
<body>

<div class="page-label">yames — Beat Section Redesign</div>
<div class="hint">Click any beat to cycle: accent → normal → silent &nbsp;·&nbsp; Press Play to simulate</div>

<div class="options-row">

  <!-- ══════ OPTION A ══════ -->
  <div class="option">
    <div class="option-tag">Option A — Amplitude Bars</div>

    <div class="app-window">
      <div class="titlebar">
        <div class="tbar-left">
          <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
          <button class="tbar-save">Save preset</button>
        </div>
        <div class="tabs">
          <button class="tab active">♩ Metronome</button>
          <button class="tab">⚡ Drill</button>
        </div>
        <div class="tbar-right">
          <button class="tbar-icon">⚙</button>
        </div>
      </div>

      <div class="content">

        <!-- BPM -->
        <div class="bpm-section">
          <button class="tap-btn">TAP</button>
          <div class="bpm-row">
            <button class="bpm-arrow">−</button>
            <span class="bpm-value">80</span>
            <button class="bpm-arrow">+</button>
          </div>
          <input type="range" class="tempo-slider" min="20" max="300" value="80" />
          <div class="tempo-mark">Andantino</div>
        </div>

        <!-- Bars -->
        <div class="bars-stage">
          <div class="bars-wrap" id="barsWrap"></div>
          <div class="bars-nums" id="barsNums"></div>
          <div class="beat-controls">
            <div class="count-stepper">
              <button class="count-btn" id="aRemove">−</button>
              <div class="count-val" id="aCount">6 beats</div>
              <button class="count-btn" id="aAdd">+</button>
            </div>
            <span class="subdiv-label">Subdiv</span>
            <div class="subdiv-pills" id="aSubdiv">
              <button class="subdiv-pill active">♩</button>
              <button class="subdiv-pill">♪♪</button>
              <button class="subdiv-pill">♪♪♪</button>
            </div>
          </div>
        </div>

        <button class="play-btn" id="playA">▶ Play</button>
      </div>
    </div>

    <div class="legend">
      <div class="leg-item"><div class="leg-sw" style="background:var(--accent);box-shadow:0 0 6px var(--accent-glow)"></div>Accent</div>
      <div class="leg-item"><div class="leg-sw" style="background:rgba(255,255,255,0.22)"></div>Normal</div>
      <div class="leg-item"><div class="leg-sw" style="background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.2)"></div>Silent</div>
    </div>
  </div>


  <!-- ══════ OPTION B ══════ -->
  <div class="option">
    <div class="option-tag">Option B — Expressive Cells</div>

    <div class="app-window">
      <div class="titlebar">
        <div class="tbar-left">
          <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
          <button class="tbar-save">Save preset</button>
        </div>
        <div class="tabs">
          <button class="tab active">♩ Metronome</button>
          <button class="tab">⚡ Drill</button>
        </div>
        <div class="tbar-right">
          <button class="tbar-icon">⚙</button>
        </div>
      </div>

      <div class="content">

        <!-- BPM -->
        <div class="bpm-section">
          <button class="tap-btn">TAP</button>
          <div class="bpm-row">
            <button class="bpm-arrow">−</button>
            <span class="bpm-value">80</span>
            <button class="bpm-arrow">+</button>
          </div>
          <input type="range" class="tempo-slider" min="20" max="300" value="80" />
          <div class="tempo-mark">Andantino</div>
        </div>

        <!-- Cells -->
        <div class="cells-stage">
          <div class="cells-wrap" id="cellsWrap"></div>
          <div class="beat-controls">
            <div class="count-stepper">
              <button class="count-btn" id="bRemove">−</button>
              <div class="count-val" id="bCount">6 beats</div>
              <button class="count-btn" id="bAdd">+</button>
            </div>
            <span class="subdiv-label">Subdiv</span>
            <div class="subdiv-pills" id="bSubdiv">
              <button class="subdiv-pill active">♩</button>
              <button class="subdiv-pill">♪♪</button>
              <button class="subdiv-pill">♪♪♪</button>
            </div>
          </div>
        </div>

        <button class="play-btn" id="playB">▶ Play</button>
      </div>
    </div>

    <div class="legend">
      <div class="leg-item"><div class="leg-sw" style="background:var(--accent);box-shadow:0 0 6px var(--accent-glow)"></div>Accent</div>
      <div class="leg-item"><div class="leg-sw" style="background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.14)"></div>Normal</div>
      <div class="leg-item"><div class="leg-sw" style="background:transparent;border:1px dashed rgba(255,255,255,0.15)"></div>Silent</div>
    </div>
  </div>

</div><!-- /options-row -->

<script>
const NSTATES = 3;

// ── State ──
let statesA = [0,1,1,1,0,2];
let statesB = [0,1,1,1,0,2];
let beatA = -1, beatB = -1;
let timerA = null, timerB = null;
let playingA = false, playingB = false;

function bpm() { return 80; }
function ms() { return 60000 / bpm(); }

// ── Render A (bars) ──
function renderA() {
  const wrap = document.getElementById('barsWrap');
  const nums = document.getElementById('barsNums');
  wrap.innerHTML = '';
  nums.innerHTML = '';

  statesA.forEach((s, i) => {
    const slot = document.createElement('div');
    slot.className = 'bar-slot';
    slot.title = ['Accent','Normal','Silent'][s] + ' — click to change';
    slot.onclick = () => { statesA[i] = (statesA[i]+1) % NSTATES; renderA(); };

    const bar = document.createElement('div');
    bar.className = 'bar' + (i === beatA ? ' lit' : '');
    bar.dataset.s = s;
    slot.appendChild(bar);
    wrap.appendChild(slot);

    const n = document.createElement('span');
    n.textContent = i+1;
    nums.appendChild(n);
  });

  document.getElementById('aCount').textContent = statesA.length + ' beats';
}

// ── Render B (cells) ──
function renderB() {
  const wrap = document.getElementById('cellsWrap');
  wrap.innerHTML = '';

  statesB.forEach((s, i) => {
    const slot = document.createElement('div');
    slot.className = 'cell-slot';
    slot.title = ['Accent','Normal','Silent'][s] + ' — click to change';
    slot.onclick = () => { statesB[i] = (statesB[i]+1) % NSTATES; renderB(); };

    const cell = document.createElement('div');
    cell.className = 'cell' + (i === beatB ? ' lit' : '');
    cell.dataset.s = s;

    const mark = document.createElement('div');
    mark.className = 'cell-mark';

    const subdots = document.createElement('div');
    subdots.className = 'cell-subdots';
    for (let d = 0; d < 2; d++) {
      const dot = document.createElement('div');
      dot.className = 'cell-subdot';
      subdots.appendChild(dot);
    }

    cell.appendChild(mark);
    cell.appendChild(subdots);

    const n = document.createElement('div');
    n.className = 'cell-n';
    n.textContent = i+1;

    slot.appendChild(cell);
    slot.appendChild(n);
    wrap.appendChild(slot);
  });

  document.getElementById('bCount').textContent = statesB.length + ' beats';
}

// ── Playback A ──
document.getElementById('playA').addEventListener('click', function() {
  if (playingA) {
    clearInterval(timerA);
    playingA = false; beatA = -1;
    this.textContent = '▶ Play';
    this.classList.remove('is-playing');
  } else {
    playingA = true; beatA = 0;
    this.textContent = '⏹ Stop';
    this.classList.add('is-playing');
    timerA = setInterval(() => { beatA = (beatA+1) % statesA.length; renderA(); }, ms());
  }
  renderA();
});

// ── Playback B ──
document.getElementById('playB').addEventListener('click', function() {
  if (playingB) {
    clearInterval(timerB);
    playingB = false; beatB = -1;
    this.textContent = '▶ Play';
    this.classList.remove('is-playing');
  } else {
    playingB = true; beatB = 0;
    this.textContent = '⏹ Stop';
    this.classList.add('is-playing');
    timerB = setInterval(() => { beatB = (beatB+1) % statesB.length; renderB(); }, ms());
  }
  renderB();
});

// ── Add / Remove beats ──
document.getElementById('aAdd').onclick    = () => { if(statesA.length<12){statesA.push(1);renderA();} };
document.getElementById('aRemove').onclick = () => { if(statesA.length>1){statesA.pop();if(beatA>=statesA.length)beatA=0;renderA();} };
document.getElementById('bAdd').onclick    = () => { if(statesB.length<12){statesB.push(1);renderB();} };
document.getElementById('bRemove').onclick = () => { if(statesB.length>1){statesB.pop();if(beatB>=statesB.length)beatB=0;renderB();} };

// ── Subdiv pills ──
document.querySelectorAll('.subdiv-pills').forEach(group => {
  group.querySelectorAll('.subdiv-pill').forEach(btn => {
    btn.onclick = () => {
      group.querySelectorAll('.subdiv-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });
});

// ── Init ──
