<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The same faces index.html pulls. Several themes name a Google font as
         their first choice, so a capture taken without these is a screenshot
         of the fallback stack — src/shots/main.tsx checks that they landed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Comfortaa:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <title>Yames — screenshot harness</title>
    <style>
      /* The window fills the frame exactly. `.main-window` carries a 10px
         radius that the OS compositor rounds against the desktop; there is no
         desktop here, and the website rounds the card itself
         (`.fan__card { border-radius: 14px }`), so a corner left rounded here
         would show as a notch inside the site's own rounding. */
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
      #root { height: 100%; }
      #root > .main-window, #root > * > .main-window { border-radius: 0 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/shots/main.tsx"></script>
  </body>
</html>
