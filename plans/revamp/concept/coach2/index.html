<html lang="en">
<head>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js"}}</script>
<style>
:root{--bg:#14100c;--panel:#1f1913;--line:#3a2f24;--ink:#f7f1e6;--quiet:#b5a895;--amber:#ffb454;--tone:#4ee08a;--tension:#5aa9ff;--clash:#ff5d6c;--display:'Barlow Condensed','Arial Narrow',sans-serif;--body:Inter,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.35 var(--body);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}

#path{border-right:1px solid var(--line);padding:18px 14px;overflow:auto;background:#17120d}
.brand{font:700 26px var(--display);letter-spacing:.14em;margin-bottom:2px}.brand b{color:var(--amber)}
.goal{color:var(--quiet);font-size:14px;margin-bottom:16px}
.pathlabel{font:600 14px var(--display);letter-spacing:.14em;color:var(--quiet);margin:14px 4px 6px;text-transform:uppercase}
.pstep{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:none;font-size:15px}

.pstep.done .dot{background:var(--tone);border-color:var(--tone)}.pstep.current .dot{border-color:var(--amber)}

#main{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(150px,1fr) auto auto auto;padding:12px 20px calc(12px + env(safe-area-inset-bottom));gap:8px}
#head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

#fb{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:#0f0b08;touch-action:manipulation}

.bar span:first-child{color:var(--quiet);font-size:15px}.bar.now{border-color:var(--ink)}

#lamp{flex:none;display:flex;align-items:center;gap:7px;font:700 14px var(--display);letter-spacing:.1em;min-width:90px}
#lamp i{width:12px;height:12px;border-radius:50%;background:var(--amber)}
#lamp.turn i{background:var(--tone)}#lamp.play i{background:var(--clash)}

#app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}

#lamp{min-width:0}#lamp span{display:none}#coach{min-height:54px;font-size:16px}.btn kbd{display:none}.btn{font-size:18px;padding:6px 13px}.bar{flex-basis:38px;font-size:14px;padding:2px 4px;gap:2px}.bar span:first-child{font-size:12px}
}

#setpanel{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:4px}#setpanel[hidden]{display:none}

.setrows li>span{flex:1;min-width:0}.setrows b{color:var(--amber);width:22px}.setrows .empty{color:var(--quiet);font:500 16px var(--body)}
.setrows button{width:40px;height:40px;border-radius:8px;background:none;border:1px solid var(--line);font-size:16px}.setrows select{font:600 17px var(--display);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px;max-width:44%}.setrows select option{color:#111;background:#fff}
.setadd{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.setadd button{padding:9px 14px;border-radius:9px;background:none;border:1px dashed var(--quiet);font:600 18px var(--display)}
body[data-tool=setlist] #hero,body[data-tool=setlist] #bars{display:none}

.choice.go{border-color:var(--amber);background:#2a2015}

#tabs button{background:none;border:0;padding:6px 2px 7px;font:600 15px var(--display);letter-spacing:.04em;color:var(--quiet);display:flex;flex-direction:column;align-items:center;gap:1px}#tabs i{font-style:normal;font-size:17px;line-height:1.1}#tabs .on{color:var(--amber)}
#main{padding-bottom:8px}
body[data-tool]:not([data-tool='']) #path{display:none}
.field{min-height:42px;padding:2px 7px;gap:4px}.field select{max-width:96px;font-size:17px}.field span{font-size:12px}
.setrows li{padding:9px;gap:7px;flex-wrap:wrap;font-size:19px}.setrows button{width:36px;height:36px}.setrows select{max-width:none}
.bar[data-tempo]{font-size:13px;flex-basis:30px}
}

<body>
<div id="app">
  <nav id="path"></nav>
  <main id="main">
    <div id="head">
      <div><div id="kicker">Theory coach</div><div id="title">Choose how you play</div></div>
      <div id="meta"><span id="source"></span><span id="bpm"></span></div>
    </div>
    <div id="hero">
      <div><div id="chordbox"><div id="chord"></div><div id="next"></div></div><div id="beats"><i></i><i></i><i></i><i></i></div></div>
      <div id="verdict" aria-live="polite"></div>
    </div>
    <div id="fb"><div id="fbhint"></div><div id="setpanel" hidden></div></div>
    <div id="settings" hidden></div>
    <div id="bars"></div>
    <div id="coach"><div id="lamp"><i></i><span>COACH</span></div><div id="line"></div></div>
    <div id="controls"></div>
  </main>
  <nav id="tabs" aria-label="Tools"></nav>
</div>
<div id="gate"><div>
  <h1>YAM<b>E</b>S theory coach</h1>
  <p>A band plays. You play. The coach hears the notes and tells you how they fit the chord.</p>
  <div id="gatebody">
    <button class="choice" data-in="mic"><b>Guitar or bass, by microphone</b><span>Real note detection. Single notes work best.</span></button>
    <label id="check"><input type="checkbox" id="hp"> I'm on headphones, or my guitar is plugged in. (Otherwise the band plays drums only, so the mic can't mistake its notes for yours.)</label>
    <button class="choice" data-in="midi"><b>MIDI keyboard or MIDI guitar</b><span>Exact notes, and chords register too.</span></button>
    <button class="choice" data-in="tap"><b>Tap the fretboard</b><span>No instrument needed. Good on a phone. Real, graded input.</span></button>
    <button class="choice" data-in="demo"><b>Watch a demo</b><span>A pretend player. Never produces a score.</span></button>
  </div>
</div></div>

<script type="module">
import * as THREE from 'three';

/* ───────────── Theory: deterministic, no model involved ───────────── */
const NAMES=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
const ROOTS={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const QUAL={'':[0,4,7],'7':[0,4,7,10],m:[0,3,7],m7:[0,3,7,10],maj7:[0,4,7,11],'6':[0,4,7,9],'9':[0,4,7,10],dim:[0,3,6],sus4:[0,5,7]};
const parseChord=c=>{const m=/^([A-G][#b]?)(maj7|m7|m|7|6|9|dim|sus4)?$/.exec(c);if(!m)return null;const root=ROOTS[m[1]],ivs=QUAL[m[2]||''];return{name:c,root,ivs,tones:ivs.map(i=>(root+i)%12)}};
const PENT=[9,0,2,4,7], BLUES=[9,0,2,3,4,7];
const pcOf=m=>((m%12)+12)%12;
function classify(pc,chordName){
  const c=parseChord(chordName), rel=(pc-c.root+12)%12;
  if(c.tones.includes(pc))return'tone';
  if([2,3,9].includes(rel))return'tension'; // the 9th, 13th and the blue b3 over a dominant chord
  return'clash';
}
function nearestTone(pc,chordName){
  let best=null;for(const t of parseChord(chordName).tones){const up=(t-pc+12)%12,down=(pc-t+12)%12,d=Math.min(up,down);if(!best||d<best.d)best={pc:t,d,dir:up<=down?'up':'down'}}
  return best;
}
const STEP_WORD=d=>d===1?'half step':d===2?'whole step':`${d} half steps`;
/* The one note that counts for a bar: the note nearest the downbeat within 1/8 of a bar.
   An outside note that quickly resolves to a chord tone inside the window counts as the resolution. */
function gradeLanding(notes,barStart,barDur,chordName){
  const w=barDur/8, inWin=notes.filter(n=>n.t>=barStart-w&&n.t<=barStart+w).sort((a,b)=>Math.abs(a.t-barStart)-Math.abs(b.t-barStart));
  let note=inWin[0];
  if(note&&classify(note.pc,chordName)!=='tone'){const res=inWin.filter(n=>n.t>note.t).find(n=>classify(n.pc,chordName)==='tone');if(res)note=res}
  if(!note)note=notes.filter(n=>n.t<barStart-w&&(n.end==null||n.end>barStart+w/2)).at(-1); // held across the downbeat
  if(!note)return{result:'rest',note:null};
  return{result:classify(note.pc,chordName),note};
}
function lcs(a,b){const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[a.length][b.length]}
/* YIN pitch detection; returns frequency and confidence, or null. */
function yin(buf,sr,W=2048){
  const tauMax=Math.min(W-1,Math.floor(sr/70)),tauMin=Math.floor(sr/1400),d=new Float32Array(tauMax+1);
  for(let tau=1;tau<=tauMax;tau++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+tau];s+=x*x}d[tau]=s}
  let run=0;d[0]=1;for(let tau=1;tau<=tauMax;tau++){run+=d[tau];d[tau]=run>0?d[tau]*tau/run:1}
  for(let tau=tauMin;tau<tauMax;tau++){if(d[tau]<.15){while(tau+1<tauMax&&d[tau+1]<d[tau])tau++;
    const a=d[tau-1],b=d[tau],c=d[tau+1],den=a+c-2*b,t=den?tau+(a-c)/(2*den):tau;return{f:sr/t,conf:1-b}}}
  return null;
}

/* ───────────── Lessons: authored, not generated ───────────── */
const BAR12=['A7','A7','A7','A7','D7','D7','A7','A7','E7','D7','A7','E7'];
const STEPS=[
{id:'box',type:'box',title:'Pentatonic box 1',skill:'notes in the box',prog:['A7'],bars:8,scale:PENT,tempos:[70,85,100],
 intro:'Solo over this groove using only the lit notes. Anything goes.',why:'A minor pentatonic has five notes that all sit well over this blues. It gets you playing music straight away. Everything else builds from this shape.'},
{id:'land',type:'land',title:'Landing on chord tones',skill:'chord tones on beat 1',prog:['A7','D7','A7','E7'],bars:8,scale:PENT,tempos:[60,75,90],
 intro:'Play freely, but land on a bright note on beat one of every bar.',why:'Chord tones are the notes that make a chord sound like itself. Landing on one when the chord changes makes your solo follow the music. They are already inside the box you know.'},
{id:'echo',type:'echo',title:'Call and response',skill:'notes echoed by ear',prog:['A7'],rounds:4,scale:PENT,tempos:[70,80,90],
 intro:'I play two bars, you play them back.',why:'Echoing trains your ear to find what you hear, and it fills your head with phrases to use later.'},
{id:'blues',type:'box',title:'Blues scale and blue notes',skill:'notes in the blues scale',prog:['A7','D7','A7','E7'],bars:8,scale:BLUES,tempos:[70,85,100],
 intro:'Same box plus one new note, E flat. Slide through it, then move on.',why:'E flat is the blue note. It sits between two notes of the box and adds the tension that makes it sound like the blues. It works best passed through, not held.'},
{id:'twelve',type:'land',title:'12-bar soloing',skill:'chord tones on beat 1',prog:BAR12,bars:12,scale:BLUES,tempos:[70,85,100],
 intro:'The full twelve bars. Follow the changes and land on chord tones.',why:'The 12-bar form is the backbone of the blues. Knowing when D7 and E7 arrive is what lets you play with the band and not just over it.'},
{id:'boss',type:'land',title:'Boss: slow blues',skill:'chord tones on beat 1',prog:BAR12,bars:24,scale:BLUES,groove:'shuffle',tempos:[60],
 intro:'Two choruses of slow blues, with everything you have learned.',why:'This puts the box, the blue note and the changes together in a real form.'},
];
const DRILL={id:'find',type:'find',title:'Name the notes',skill:'notes found',prog:['A7'],bars:16,scale:[],tempos:[70,90,110],
 intro:'Find each note I name, anywhere on the neck.',why:'Knowing where the notes are is what lets you find chord tones in any key. It is a side drill: a couple of minutes a day.'};
const ALL=[...STEPS,DRILL], step=id=>ALL.find(s=>s.id===id);
const LICKS=[ // [midi, beat within the two-bar call, length in beats]
 [[69,0,1],[72,1,1],[69,2,1],[67,3,2]],
 [[64,0,.5],[67,1,.5],[69,2,1],[67,3,.5],[64,4,2]],
 [[60,0,1],[62,1,1],[64,2,1],[62,3,1],[60,4,2]],
 [[72,0,1],[69,1,.5],[67,2,1],[64,3,1],[62,4,1],[60,5,2]],
];
const FIND=[0,4,7,2,9,5,11,3];

/* ───────────── Saved progress: stays in this browser ───────────── */
const KEY='yames-coach-proto-2';
const store=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('yames-coach-proto-1'))||{}}catch{return{}}})();
store.skills??={};store.days??=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch{}};
const skill=id=>store.skills[id]??={hist:[],tempo:0,tries:0,done:false};
const dayStr=d=>d.toISOString().slice(0,10);
function weekCount(){const n=new Date(),mon=new Date(n);mon.setDate(n.getDate()-((n.getDay()+6)%7));const m=dayStr(mon);return store.days.filter(d=>d>=m).length}

/* ───────────── App state ───────────── */
const $=id=>document.getElementById(id);
const S={state:'gate',input:null,band:'full',step:null,bpm:70,groove:'shuffle',run:0,take:null,lastFacts:null,click:false};
let ctx=null,master=null,bandBus=null;

/* ───────────── Audio: a real click and band, synthesised ───────────── */
function ensureAudio(){
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.85;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    const len=ctx.sampleRate*.4,b=ctx.createBuffer(1,len,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;noiseBuf=b}
  if(ctx.state==='suspended')ctx.resume();
}
let noiseBuf;
const newBus=()=>{const g=ctx.createGain();g.connect(master);return g};
function env(g,t,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function kick(bus,t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.11);env(g,t,.95,.2);o.connect(g).connect(bus);o.start(t);o.stop(t+.22)}

const mic={analyser:null,timer:null,cur:null,cand:null,lastPitchT:0,rms:0,smooth:0,buf:null,listeners:new Set()};
async function openMic(){

  if(!hit||hit.conf<.86){if(mic.cur&&t-mic.lastPitchT>.13){mic.cur.end=mic.lastPitchT;mic.cur=null}mic.cand=null;return}
  const m=Math.round(69+12*Math.log2(hit.f/440));if(m<28||m>96)return;
  mic.lastPitchT=t;
  if(mic.cur&&m===mic.cur.midi){mic.cand=null;return}
  if(!mic.cand||mic.cand.midi!==m)mic.cand={midi:m,n:1,t,attack};else{mic.cand.n++;mic.cand.attack||=attack}
  if(mic.cand.n<3)return; // 3 stable frames, about 100 ms; quicker notes are ignored rather than guessed
  const c=mic.cand;mic.cand=null;
  if(mic.cur&&!c.attack){const dist=Math.abs(c.midi-mic.cur.midi);
    if(dist<=2){mic.cur.midi=c.midi;mic.cur.pc=pcOf(c.midi);flashNote(mic.cur);return} // bend or slide: the note is where it lands
    if(dist%12===0)return}
  if(mic.cur)mic.cur.end=c.t;

function noteIn(n){

  const T=S.take;if(!T||!(S.state==='take'||(S.state==='count'&&n.t>=T.start-T.barDur/8)))return; // a pickup into bar 1 counts
  T.notes.push(n);
  if(T.step.type==='box'){const k=T.step.scale.includes(n.pc);showVerdict(NAMES[n.pc],k?'tone':'clash',k?'in the box':'outside the box')}

}

/* ───────────── Coach voice: templates filled from the fact sheet ───────────── */
let speakDone=null,muted=false;
function speak(text,tok){
  setLine(text);setLamp('coach');
  return new Promise(res=>{
    const finish=()=>{clearTimeout(timer);if(speakDone===finish)speakDone=null;res()};
    speakDone=finish;
    const timer=setTimeout(finish,Math.max(1600,text.length*72)+800);
    if(muted||!window.speechSynthesis){clearTimeout(timer);setTimeout(finish,Math.min(2600,text.length*32));return}
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.04;u.onend=finish;u.onerror=finish;speechSynthesis.speak(u)}catch{finish()}
  });
}
function skipSpeech(){try{speechSynthesis?.cancel()}catch{}speakDone?.()}
$('coach').addEventListener('click',skipSpeech);

/* ───────────── Voice commands: only when it is your turn ───────────── */
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,recOn=false,recBroken=!Rec;

  rec=new Rec();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;recOn=true;
  rec.onresult=e=>{const t=e.results[e.results.length-1];if(!t.isFinal)return;const c=matchCommand(t[0].transcript);if(c)command(c);else setLine('Didn’t catch that. Say again, slower, faster, next or why.')};
  rec.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))recBroken=true};

  try{rec.start()}catch{recOn=false}

function stopListen(){if(rec&&recOn){try{rec.abort()}catch{}}recOn=false}

  S.take=null;header();renderPath();clearVerdict();$('bars').innerHTML='';$('next').textContent='';
  $('chord').textContent=st.type==='find'?'':st.prog[0];setBoard(boardFor(st,st.prog[0]));$('fbhint').textContent=S.input==='tap'?'Tap a note to play it':'';

async function intro(){

function renderBarChips(T){

  if(st.type==='echo')return Array.from({length:st.rounds},(_,i)=>`<div class="bar" data-bar="${i}"><span>${i+1}</span><span>·</span></div>`).join('');
  if(st.type==='find')return T.targets.map((p,i)=>`<div class="bar" data-bar="${i}"><span>find</span><span>${NAMES[p]}</span></div>`).join('');
  return Array.from({length:T.bars},(_,i)=>`<div class="bar" data-bar="${i}"><span>${i+1}</span><span>·</span></div>`).join('');
}
function demoNotes(T){ // A pretend player, so the screens can be seen. Marked DEMO and never scored.
  const out=[],st=T.step;let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const near=pc=>{const ops=spots.filter(p=>p.pc===pc);return ops[Math.floor(rnd()*ops.length)].midi};
  if(st.type==='echo'){for(let r=0;r<st.rounds;r++)LICKS[r%LICKS.length].forEach(([m,b])=>out.push({t:T.start+(r*4+2)*T.barDur+b*60/S.bpm+.02,midi:rnd()<.85?m:m+2}));return out}
  if(st.type==='find'){T.targets.forEach((pc,i)=>out.push({t:T.start+(i*2+.6)*T.barDur,midi:near(pc)}));return out}
  for(let i=0;i<T.bars;i++){const c=parseChord(T.chordAt(i)),t=T.start+i*T.barDur;
    const land=rnd()<.7?c.tones[Math.floor(rnd()*4)]:st.scale[Math.floor(rnd()*st.scale.length)];
    out.push({t:t+.01,midi:near(land)});for(let k=1;k<5;k++)out.push({t:t+k*T.barDur/5,midi:near(st.scale[Math.floor(rnd()*st.scale.length)]||9)})}
  return out;
}

      else if(T.lastBar!==bar&&bar<T.bars){T.lastBar=bar;const ch=T.chordAt(bar),nx=T.chordAt(bar+1);$('chord').textContent=ch;$('next').textContent=nx!==ch?`next ${nx}`:'';
        if(!T.call)setBoard(boardFor(T.step,ch));

}
function stepLive(T,now,vt,bar){
  const st=T.step;
  if(st.type==='land'){
    const w=T.barDur/8;
    while(T.judged.length<T.bars&&now>T.start+T.judged.length*T.barDur+w+.03){
      const i=T.judged.length,r=gradeLanding(T.notes,T.start+i*T.barDur,T.barDur,T.chordAt(i));T.judged.push(r);
      const chip=document.querySelector(`.bar[data-bar="${i}"]`);if(chip){chip.lastElementChild.textContent=r.note?NAMES[r.note.pc]:'–';if(r.note)chip.classList.add(r.result)}
      if(r.note)showVerdict(NAMES[r.note.pc],r.result,{tone:`chord tone of ${T.chordAt(i)}`,tension:`tension over ${T.chordAt(i)}`,clash:`clashes with ${T.chordAt(i)}`}[r.result]);else showVerdict('–','rest','no note on beat 1');
    }

    if(T.phase!==`${round}${calling}`){T.phase=`${round}${calling}`;if(calling){showVerdict('Listen','rest');}else showVerdict('Your turn','tone')}

    const key=lit.join();if(key!==T.litKey){T.litKey=key;setBoard(p=>lit.includes(p.midi)?'lick':(st.scale.includes(p.pc)?(p.pc===9?'root':'box'):null))}
    if(!calling){const rNotes=T.notes.filter(n=>T.barAt(n.t)>=round*4+2&&T.barAt(n.t)<round*4+4);const chip=document.querySelector(`.bar[data-bar="${round}"]`);if(chip)chip.lastElementChild.textContent=String(rNotes.length)}
  } else if(st.type==='box'){
    const c=T.notes.filter(n=>T.barAt(n.t)===bar),chip=document.querySelector(`.bar[data-bar="${bar}"]`);if(chip&&c.length)chip.lastElementChild.textContent=String(c.length);
  } else if(st.type==='find'){
    T.targets.forEach((_,i)=>{const chip=document.querySelector(`.bar[data-bar="${i}"]`);if(chip&&T.found[i])chip.classList.add('tone')});
  }
}

/* ───────────── Grading into a fact sheet ───────────── */
function facts(T){
  const st=T.step,playable=T.notes.filter(n=>n.t>=T.start-T.barDur/8);
  if(st.type==='land'){
    while(T.judged.length<T.bars){const i=T.judged.length;T.judged.push(gradeLanding(T.notes,T.start+i*T.barDur,T.barDur,T.chordAt(i)))}
    const r=T.judged,tones=r.filter(x=>x.result==='tone').length,tension=r.filter(x=>x.result==='tension').length,clash=r.filter(x=>x.result==='clash').length,judged=tones+tension+clash;
    const misses=r.map((x,i)=>({...x,chord:T.chordAt(i),bar:i})).filter(x=>x.result==='clash');
    return{kind:'land',enough:judged>=Math.ceil(T.bars/2),hits:tones,total:judged,tension,clash,rests:T.bars-judged,score:judged?Math.round(tones/judged*100):0,misses};
  }
  if(st.type==='box'){const total=playable.length,ok=playable.filter(n=>st.scale.includes(n.pc)).length,outside=playable.filter(n=>!st.scale.includes(n.pc)).map(n=>NAMES[n.pc]),blue=playable.filter(n=>n.pc===3).length;return{kind:'box',enough:total>=6,hits:ok,total,outside,blue,score:total?Math.round(ok/total*100):0}}
  if(st.type==='echo'){const rounds=[];let hit=0,total=0;for(let r=0;r<st.rounds;r++){const lick=LICKS[r%LICKS.length].map(l=>pcOf(l[0])),got=T.notes.filter(n=>{const b=T.barAt(n.t);return b>=r*4+2&&b<r*4+4}).sort((a,b)=>a.t-b.t).map(n=>n.pc),m=lcs(lick,got);rounds.push({lick,got,m});hit+=m;total+=lick.length}
    const heard=rounds.reduce((a,r)=>a+r.got.length,0);return{kind:'echo',enough:heard>=Math.ceil(total/4),hits:hit,total,rounds,score:Math.round(hit/total*100)}}
  const hits=T.found.filter(Boolean).length;return{kind:'find',enough:T.notes.length>0,hits,total:T.targets.length,score:Math.round(hits/T.targets.length*100),missed:T.targets.filter((_,i)=>!T.found[i]).map(p=>NAMES[p])};
}
function feedback(f){
  if(!f.enough)return'I didn’t catch enough to judge that, so I won’t guess. Play it again, single notes held a little longer.';
  if(f.kind==='land'){let s=`${f.hits} of ${f.total} landings were chord tones.`;const m=f.misses[0];
    if(m){const n=nearestTone(m.note.pc,m.chord);s+=` Over ${m.chord} you landed on ${NAMES[m.note.pc]}, which clashes. ${NAMES[n.pc]} is a ${STEP_WORD(n.d)} ${n.dir} and is a chord tone.`}
    else if(f.tension)s+=` ${f.tension} landed on a tension, which can sound great if it moves to a chord tone.`;else s+=' Clean.';return s}
  if(f.kind==='box'){let s=`${f.hits} of ${f.total} notes were in the box.`;if(f.outside.length)s+=` Outside: ${[...new Set(f.outside)].slice(0,3).join(', ')}.`;if(f.blue)s+=` You touched the blue note ${f.blue} time${f.blue>1?'s':''}.`;return s}
  if(f.kind==='echo'){let s=`You echoed ${f.hits} of ${f.total} notes in order.`;const w=f.rounds.findIndex(r=>r.m<r.lick.length);if(w>=0){const r=f.rounds[w],missing=r.lick.find(p=>!r.got.includes(p));if(missing!=null)s+=` In phrase ${w+1} you missed the ${NAMES[missing]}.`}return s}
  return`You found ${f.hits} of ${f.total} notes.${f.missed.length?` Missed: ${f.missed.slice(0,3).join(', ')}.`:''}`;
}
async function finishTake(T){

  [...$('beats').children].forEach(d=>d.classList.remove('on'));$('chord').textContent='';$('next').textContent='';setBoard(boardFor(st,st.prog[0]));
  const demo=S.input==='demo';let line=feedback(f),verdictSmall='';
  if(demo){showVerdict('Demo','rest','pretend player, not scored');line='That was a pretend player, so there is no score. Pick another input to get a real one.'}
  else if(!f.enough){showVerdict('Didn’t hear enough','rest','no score')}

    const sk=skill(st.id),prev=sk.hist.at(-1),target=st.tempos[Math.min(sk.tempo,st.tempos.length-1)];
    sk.hist.push({s:f.score,bpm:S.bpm,d:Date.now()});const today=dayStr(new Date());if(!store.days.includes(today))store.days.push(today);

    save();showVerdict(`${f.score}%`,'score',verdictSmall);

function listenWhenQuiet(tok){setTimeout(()=>{if(tok===S.run)listen()},400)}
function command(c){

/* Jam: the band is already playing; change anything without stopping */
const JAM_CHARTS={blues:['12-bar blues',[[0,'7'],[0,'7'],[0,'7'],[0,'7'],[5,'7'],[5,'7'],[0,'7'],[0,'7'],[7,'7'],[5,'7'],[0,'7'],[7,'7']]],pop:['I V vi IV',[[0,''],[7,''],[9,'m'],[5,'']]],minor:['i VI III VII',[[0,'m'],[8,''],[3,''],[10,'']]],jazz:['ii V I',[[2,'m7'],[7,'7'],[0,'maj7'],[0,'maj7']]],one:['One chord',[[0,'m7']]]};

function jamScale(ch){const c=parseChord(ch[0]),minor=!c.ivs.includes(4)||c.ivs.includes(10),base=minor?[0,3,5,7,10]:[0,2,4,7,9];return base.map(i=>(c.root+i)%12)}

  enterTool('jam','Jam','No grades. Change anything while it plays.');const chart=jamChart();S.bpm=store.jam.bpm;S.click=store.jam.click;

  [0,1,2,3].forEach(b=>click(T.bus,T.count+b*T.barDur/4,b===0));go('jam');$('bpm').innerHTML=`${S.bpm}<small>BPM</small>`;jamChips(T);setLamp('play');setLine('Bright notes follow the chord. Dim ones are the scale.');jamControls(true);

function jamChips(T){$('bars').innerHTML=T.step.prog.map((c,i)=>`<div class="bar" data-chart="${i}"><span>${i+1}</span><span>${c}</span></div>`).join('')}
function jamApply(){const T=S.take;store.jam.bpm=S.bpm;save();if(!T||!T.jam)return;const ch=jamChart();T.step.prog=ch;T.step.scale=jamScale(ch);T.lastBar=null;jamChips(T)}
function jamControls(on){
  const j=store.jam,keys=NAMES.map((n,i)=>[i,n]),charts=[...Object.entries(JAM_CHARTS).map(([k,v])=>[k,v[0]]),['mine','My chords…']];

  const row=[on?btn('Stop',jamStop,{primary:true,key:'Esc'}):btn('Play',()=>startJam(),{primary:true,key:'Space'}),btn('−5',()=>{setBpmLive(S.bpm-5);jamApply()}),btn('+5',()=>{setBpmLive(S.bpm+5);jamApply()}),selectOf('Key',keys,j.key,v=>{j.key=+v;if(j.chart==='mine')j.chart='blues';save();jamApply();jamControls(!!S.take)}),selectOf('Chords',charts,j.chart,v=>{j.chart=v;save();if(v!=='mine')jamApply();jamControls(!!S.take);if(v==='mine')$('mine')?.focus()}),st,clk,...setBtns()];
  controls(row);
  if(j.chart==='mine'){const w=document.createElement('label');w.className='field wide';w.innerHTML='<span>Your chords</span>';const i=document.createElement('input');i.id='mine';i.placeholder='Am7 D7 Gmaj7 Cmaj7';i.value=j.custom;i.onkeydown=e=>{if(e.key==='Enter')i.blur()};i.onchange=()=>{const c=parseCustom(i.value);if(!c){setLine(`I can’t read “${i.value}”. Try chords like Am7 D7 Gmaj7.`);return}j.custom=i.value;save();jamApply();setLine(`Band has it: ${c.join(' ')}.`)};w.append(i);$('controls').append(w)}

function jamStop(){noteTime(S.take?.began);if(S.take){fadeBus(S.take.bus);S.take=null}S.click=false;[...$('beats').children].forEach(d=>d.classList.remove('on'));go('toolidle');$('chord').textContent='';$('next').textContent='';setLamp('coach');setLine('Band’s stopped. Same chords whenever you’re ready.');jamControls(false)}

/* Setlist: the coach has one ready; yours is one tap to edit */
function coachSet(){const n=STEPS.find(s=>!skill(s.id).done)||STEPS[0];return[{k:'metro',min:2,bpm:store.metro.bpm},{k:'lesson',id:n.id},{k:'ramp'},{k:'jam',min:3}]}
const stepName=s=>({metro:`Metronome · ${s.min} min`,lesson:step(s.id||'box').title,ramp:`Ramp up · ${rampCfg().from} to ${rampCfg().to}`,jam:`Jam · ${s.min} min`}[s.k]);

function openSetlist(){
  enterTool('setlist','Setlist','Press start. It runs itself.');setView=store.myset?.length&&setView==='mine'?'mine':setView;drawSet();
}
function drawSet(){

    if(t.dataset.add){store.myset.push({metro:{k:'metro',min:2},lesson:{k:'lesson',id:'land'},ramp:{k:'ramp'},jam:{k:'jam',min:3}}[t.dataset.add]);save();return drawSet()}
    const li=t.closest('li[data-i]');if(!li||!t.dataset.a)return;const i=+li.dataset.i,l=store.myset;if(t.dataset.a==='del')l.splice(i,1);else{const j=i+(t.dataset.a==='up'?-1:1);if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]]}save();drawSet()};

function setStart(list){if(!list.length)return;S.set={steps:list.map(x=>({...x})),i:0,began:Date.now()};runSetStep()}
function runSetStep(){const s=S.set.steps[S.set.i];

  else if(s.k==='jam')startJam({min:s.min});else if(s.k==='ramp')startRamp();else openStep(s.id||'land')}

function showSetDone(fin,mins){setLine(fin?`Set finished in about ${mins} minute${mins===1?'':'s'}. ${weekCount()} of 3 sessions this week.`:'Set ended. Start it again whenever you like.');renderPath()}
function setBanner(){if(!S.set)return;const s=S.set,n=s.steps[s.i+1],T=S.take,end=M?.endAt??T?.endAt;let left='';if(end&&ctx){const r=Math.max(0,Math.ceil(end-ctx.currentTime));left=` · ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')} left`}$('kicker').textContent=`Set ${s.i+1} of ${s.steps.length}${left}${n?` · next ${stepName(n).split(' ·')[0]}`:' · last one'}`}

function noteTime(began){const b=began??M?.began;if(ctx&&b!=null&&ctx.currentTime-b>=60)markDay()} // a tool counts as practice after a minute
function toolTick(){
  if(!ctx)return;const now=ctx.currentTime;

  go('idle');stopListen();clearVerdict();$('bars').innerHTML='';$('chord').textContent='';

  showVerdict(`${n} of 3`,'score','sessions this week');setLamp('coach');
  setLine(moved?`Done for now. ${moved}.`:'Done for now. Nothing scored yet.');renderPath();

document.addEventListener('keydown',e=>{
  if(['SELECT','INPUT'].includes(e.target.tagName)||S.state==='gate')return;
  const k=e.key.toLowerCase();

    if(e.key===' '){e.preventDefault();return M?metroStop():startMetro()}
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();return setBpmLive(S.bpm+(e.shiftKey?5:1))}
    if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();return setBpmLive(S.bpm-(e.shiftKey?5:1))}
    if(k==='t')return tapTempo();if(k==='n'&&S.set)return setNext();if(e.key==='Escape'&&M)return metroStop();return}
  if(S.tool==='ramp'){
    if(e.key===' '){e.preventDefault();return M?rampFinish('stop'):startRamp()}
    if(k==='h')return rampHold();if(k==='b')return rampBack();if(k==='n'&&S.set)return setNext();if(e.key==='Escape'&&M)return rampFinish('stop');return}
  if(S.tool==='jam'){
    if(e.key==='Escape'&&S.take)return jamStop();if(e.key===' '){e.preventDefault();return S.take?jamStop():startJam()}
    if(e.key==='ArrowUp'){e.preventDefault();setBpmLive(S.bpm+5);return jamApply()}if(e.key==='ArrowDown'){e.preventDefault();setBpmLive(S.bpm-5);return jamApply()}
    if(k==='n'&&S.set)return setNext();return}
  if(S.tool==='setlist'){if(e.key===' '){e.preventDefault();$('controls').firstChild?.click()}return}
  if(e.key===' '){e.preventDefault();if(S.state==='intro'||speakDone)return skipSpeech();if(S.state==='result')return command('again');if(S.state==='idle'&&S.step)return openStep(S.step.id)}
  if(e.key==='Escape'){if(S.state==='take'||S.state==='count')return stopTake();if(S.state==='result'&&!S.set)return wrapUp()}
  if(S.state==='result')({s:'slower',f:'faster',w:'why',n:'next',j:'jam'}[k]&&command({s:'slower',f:'faster',w:'why',n:'next',j:'jam'}[k]));
});

  let n=0;const m=setInterval(()=>{$('meter').firstChild.style.width=Math.min(100,mic.rms*400)+'%'},60);
  S.scNote=note=>{n++;$('scnote').textContent=NAMES[note.pc];$('sctext').textContent=`Heard ${NAMES[note.pc]}. ${n<2?'Play another to be sure.':'That works.'}`;if(n>=1)$('scgo').style.display=''};

function begin(){if(S.input!=='demo'){store.input=S.input;save()}$('gate').remove();const first=STEPS.find(s=>!skill(s.id).done)||STEPS[0];openStep(first.id)}
