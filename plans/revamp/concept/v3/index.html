<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0709">
<title>Yames · Coach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Caveat:wght@700&display=swap">
<style>
:root{--pocket:#3dffa2;--early:#5aa9ff;--late:#ff8a3d;--miss:#ff3d6e;--coach:#c8a8ff;--listen:#ffe14d;--ink:#f4f1ea;--dim:#c9c0ba;--rpx:160px;
 --t:max(15px,2.6vmin);--chip:max(19px,3vmin);--tape:#e9e4d6;
 --disp:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0709;color:var(--ink);font-family:var(--disp);font-weight:700;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block}
.ov{position:fixed;pointer-events:none}
/* top corners */
#hudL{top:calc(10px + env(safe-area-inset-top));left:16px;max-width:30vw;white-space:nowrap}
#stepTag{font-size:var(--t);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#stepName{font-size:calc(var(--t)*1.5);font-weight:800;line-height:1.05}
#takeLine{font-size:var(--t);color:var(--ink);letter-spacing:.06em;margin-top:2px}
#hudR{top:calc(10px + env(safe-area-inset-top));right:16px;text-align:right;white-space:nowrap}
#bpm{font-size:calc(var(--t)*2.2);font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;transition:color .3s}
#bpm small{font-size:.45em;font-weight:700;color:var(--dim);margin-left:4px}
#bpm.flash{color:var(--listen)}
#src{font-size:var(--t);letter-spacing:.08em;margin-top:2px}
#src.demo{display:inline-block;background:var(--ink);color:#0b0709;padding:0 .5em;font-weight:800}
/* status light on the amp's control panel */
#sign{left:50%;transform:translate(-50%,-50%);font-size:calc(var(--t)*1.15);font-weight:800;letter-spacing:.12em;padding:.04em .7em;border-radius:4px;white-space:nowrap;background:#0d0908;color:var(--ink);border:2px solid #fff3}
#sign:empty{display:none}
#sign::before{content:"";display:inline-block;width:.62em;height:.62em;border-radius:50%;margin-right:.45em;vertical-align:.03em;background:#fff}
#sign[data-k=COACH]{color:var(--coach);border-color:var(--coach)} #sign[data-k=COACH]::before{background:var(--coach);box-shadow:0 0 12px var(--coach)}
#sign[data-k="YOUR TURN"]{color:var(--listen);border-color:var(--listen)} #sign[data-k="YOUR TURN"]::before{background:var(--listen);box-shadow:0 0 12px var(--listen)}
#sign[data-k=PLAYING]::before{background:#e11;box-shadow:0 0 12px #e11}
/* centre of the ring */
#center{left:0;top:0;width:0;height:0}
#cbox{position:absolute;transform:translate(-50%,-50%);text-align:center;width:calc(var(--rpx)*1.62)}
#big{font-size:calc(var(--rpx)*.62);font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 0 calc(var(--rpx)*.08) #0009}
#cbox.verdict #big{font-size:calc(var(--rpx)*.36);line-height:.98;text-transform:uppercase}
#cbox.chord #big{font-size:calc(var(--rpx)*.86)}
#word{font-size:max(17px,calc(var(--rpx)*.15));font-weight:800;letter-spacing:.12em;margin-top:.15em;text-transform:uppercase}
#small{font-size:max(16px,calc(var(--rpx)*.118));color:var(--ink);opacity:.82;margin-top:.15em;line-height:1.1}
#cbox.chord #small{font-size:max(24px,calc(var(--rpx)*.24));opacity:1;font-weight:800}
#dots{display:none;justify-content:center;gap:calc(var(--rpx)*.05);margin-top:calc(var(--rpx)*.06)}
#dots i{width:calc(var(--rpx)*.055);height:calc(var(--rpx)*.055);border-radius:50%;background:#fff3}
#dots i.on{background:#fff}
body[data-view=take] #dots,body[data-view=count] #dots{display:flex}
/* under the ring: captions, meter, legend. Never overlaps the ring. */
#under{left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--t)*.35);padding:0 14px}
#caption{max-width:min(26em,96vw);text-align:center;font-size:max(20px,3.3vmin);line-height:1.12;text-shadow:0 1px 10px #000,0 0 3px #000;display:none}
#caption.show{display:block}
#meter{width:min(calc(var(--rpx)*2.2),92vw);display:none}
#meter .row{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t);letter-spacing:.08em}
#meter .row b{font-size:calc(var(--t)*1.7);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0}
#meter .bar{height:calc(var(--t)*.42);border-radius:3px;background:#ffffff1f;overflow:hidden}
#meter .bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s}
#legend{display:none;flex-wrap:wrap;justify-content:center;gap:0 1em;font-size:var(--t)}
#legend span{white-space:nowrap}
#banner{display:none;background:var(--ink);color:#0b0709;font-size:calc(var(--t)*1.25);font-weight:800;padding:.05em .7em;letter-spacing:.06em;text-align:center}
body.demo #banner{display:block}
body[data-view=take].real #meter{display:block}
body[data-view=take].firstbar #legend,body[data-view=count] #legend{display:flex}
body[data-view=take] #caption,body[data-view=count] #caption,body[data-view=jam] #caption{display:none}
body[data-view=jam] #banner,body[data-view=check] #banner,body[data-view=intro] #banner{display:none}
/* bottom dock */
#dock{left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
#echo{font-size:calc(var(--t)*1.25);font-weight:800;background:var(--listen);color:#111;padding:0 .6em;border-radius:3px;opacity:0;transition:opacity .25s}
#echo.show{opacity:1}
#heard{font-size:var(--t);color:var(--listen);min-height:1em;text-align:center}
#chips,#more{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#more{display:none} #more.show{display:flex}
.chip{pointer-events:auto;min-height:max(52px,6vmin);padding:0 .85em;border-radius:6px;border:2px solid #ffffff55;background:#150e10e6;color:var(--ink);font:800 var(--chip) var(--disp);letter-spacing:.05em;cursor:pointer;text-transform:uppercase}
.chip.hero{background:var(--listen);color:#111;border-color:var(--listen)}
.chip.sm{font-size:max(17px,2.6vmin);min-height:48px;font-weight:700}
.chip:active{filter:brightness(1.4)}
#hint{font-size:var(--t);color:var(--ink);opacity:.8;text-align:center;line-height:1.1}
/* practice list: sticky notes on the wall */
#notes{left:0;right:0;display:none;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1.6vmin,20px);padding:0 10px}
body[data-view=where] #notes{display:flex}
.note{width:min(15vw,230px);min-height:calc(var(--t)*4.6);background:#d9cfa8;color:#2a2118;font:700 max(21px,3.5vmin)/1 Caveat,"Segoe Print","Bradley Hand",cursive;padding:.35em .4em;box-shadow:0 5px 14px #000a;opacity:0;transform:translateY(8px) rotate(var(--rot));transition:opacity .4s,transform .4s}
.note.show{opacity:1;transform:rotate(var(--rot))}
.note small{display:block;font:inherit;font-size:.82em;margin-top:.2em;color:#5a4c36}
.note.later{background:#8f8768;color:#221b12} .note.later small{color:#322a1c}
.note.today{background:#fff8dc;outline:3px solid #d0342c;outline-offset:2px}
.note.today small{color:#d0342c}
@media (max-aspect-ratio:17/20){.note{width:29vw}}
body[data-view=where] #center{visibility:hidden}
body[data-view=jam] #src{display:none}
/* soundcheck */
#lvl{display:none;width:min(calc(var(--rpx)*1.3),70vw);height:calc(var(--t)*.5);background:#ffffff1f;margin:.3em auto 0;overflow:hidden;border-radius:3px}
#lvl i{display:block;height:100%;width:0;background:#fff}
body[data-view=check] #lvl{display:block}
/* gate */
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#3a1a20 0,#0b0709 70%);z-index:9;text-align:center;padding:24px}
#gate h1{margin:0;font-size:clamp(48px,12vmin,110px);letter-spacing:.04em;font-weight:800}
#gate p{margin:0;color:var(--ink);opacity:.86;font-size:max(18px,3vmin);max-width:26em;line-height:1.2}
#go{width:min(240px,58vw);aspect-ratio:1;border-radius:50%;border:3px solid var(--listen);background:#ffe14d22;color:#fff;font:800 max(26px,4vmin) var(--disp);letter-spacing:.06em;cursor:pointer}
@media (max-aspect-ratio:17/20){#stepName{font-size:calc(var(--t)*1.35)}#hudL{max-width:58vw}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <button id="go">Tap to start</button>
  <p style="font-size:max(16px,2.4vmin)">Using a mic? Wear headphones, or it hears the click instead of you. You can also tap along.</p>
</div>

<div id="center" class="ov"><div id="cbox"><div id="big"></div><div id="dots"><i></i><i></i><i></i><i></i></div><div id="word"></div><div id="small"></div><div id="lvl"><i></i></div></div></div>
<div id="notes" class="ov"></div>
<div id="sign" class="ov"></div>
<div id="under" class="ov">
  <div id="banner">DEMO PLAYER · NOT YOU · NOT SCORED</div>
  <div id="meter"><div class="row"><span>IN THE POCKET</span><b id="mval">0%</b></div><div class="bar"><i id="mbar"></i></div></div>
  <div id="legend"><span style="color:var(--early)">inside: EARLY</span><span style="color:var(--pocket)">band: POCKET</span><span style="color:var(--late)">outside: LATE</span></div>
  <div id="caption"></div>
</div>
<div id="dock" class="ov">
  <div id="echo"></div><div id="heard"></div>
  <div id="chips"></div><div id="more"></div>
  <div id="hint"></div>
</div>

{ const m = darkMat, b1 = new THREE.Mesh(new THREE.CircleGeometry(.78, 20), m), b2 = new THREE.Mesh(new THREE.CircleGeometry(.56, 20), m), neck = new THREE.Mesh(new THREE.PlaneGeometry(.15, 2.3), m), head = new THREE.Mesh(new THREE.PlaneGeometry(.26, .55), m);

const plank = new THREE.Mesh(unitBox, new THREE.MeshBasicMaterial({ color: 0x120c0a })); board.add(plank);
const pedals = [0x2c3d38, 0x45241f, 0x4a3d1c, 0x28303f].map(c => { const p = new THREE.Mesh(unitBox, new THREE.MeshBasicMaterial({ color: c })); board.add(p); return p; });

      const a = base / 100 * TAU; prevTick.position.set(Math.sin(a) * (R + .51), Math.cos(a) * (R + .51), .03); prevTick.rotation.z = -a;
      setView('moved');
      app.hist[step.id] = best.pct; store.set('yames-v3-hist', app.hist);
      s.moved.push({ name: step.name.split(':')[0], prev: base, fromTxt, best: best.pct });
      after(RM ? 300 : 2300, 'minDone');
      speak(delta === 0 ? `In the pocket ${best.pct} percent, same as ${fromTxt}.` : `In the pocket ${best.pct} percent, ${up ? 'up' : 'down'} from ${base}.`);
    },
    on: {
      spoken() { M.d.spoken = true; if (M.d.minDone) S.moved.done(); },
      minDone() { M.d.minDone = true; if (M.d.spoken) S.moved.done(); },
      tap() { S.moved.done(); }, esc() { S.moved.done(); }, 'cmd:next'() { S.moved.done(); },

    done() { if (app.gauge) app.gauge.t0 = -1e9; app.sess.movedShown = true; go('wait'); },
  },
  where: {
    enter(d) {

      setView('where'); setSign('');
      const fi = PATH.findIndex(n => n.id === FRONTIER), host = $('notes'); host.innerHTML = '';

        el.innerHTML = `${done ? '✓ ' : ''}${L.portrait ? n.short : n.label}<small>${done ? (sc !== undefined ? `${sc}% in the pocket` : 'ticked off') : today ? 'today' : i === fi + 1 ? 'next' : 'later'}</small>`;
        host.appendChild(el); NOTES.push(el);

    exit() { const d = M.d; setView(d.prevView); caption(d.prevCap); },
    on: {
      spoken() { M.d.spoken = true; if (M.d.minDone) go(M.d.back); },
      minDone() { M.d.minDone = true; if (M.d.spoken) go(M.d.back); },
      tap() { go(M.d.back); }, esc() { go(M.d.back); },
    },
  },
  jam: { sign: 'PLAYING', sr: 'jam',
    enter() { setView('jam'); setChips([['stop', 'Stop the jam', 'hero']], ''); },
    on: { esc() { S.jam.end(); }, 'cmd:stop'() { S.jam.end(); } },
    end() { setEvents([]); killBus(); app.tk.done = true; app.tk = null; go('wrap'); },
  },
  wrap: {
    enter() {
      const s = app.sess; app.tk = null; clearHits(); setEvents([]); killBus(); setView('wrap'); setHud('Done for today', 'Nice work', ''); setBpm(0);
      const real = s.moved.length > 0;
      center(real ? 'DONE FOR TODAY' : 'DEMO DONE', real ? '' : 'nothing scored', s.moved.map(m => `${m.name} ${m.prev} → ${m.best}%`).join('\n'), '#fff', 'verdict');
      $('small').style.whiteSpace = 'pre-line';
      go('talk', { line: real ? s.moved.map(m => (m.best === m.prev ? `${m.name}: ${m.best}, holding steady.` : `${m.name}: ${m.best}, ${m.best > m.prev ? 'up' : 'down'} from ${m.prev}.`)).join(' ') + ' Next time, syncopation.' : 'That was the demo. Run a soundcheck and tap along, and I will score you for real.', then: () => go('done') });
    },
  },
  done: { sign: 'YOUR TURN', sr: 'listen',
    enter() { setChips([['again', 'Go again', 'hero'], ['check', 'Soundcheck'], ['where', 'Where am I']], SR.ok ? 'Say again for another round' : ''); },
    on: {
      'cmd:again': () => { newSession(); startItem(); }, 'cmd:go': () => { newSession(); startItem(); },
      'cmd:where': () => go('where', { back: 'done' }), 'cmd:check': () => { newSession(); go('check_hear', { recheck: true }); },
    },
  },
};

/* ---------- input ---------- */
addEventListener('pointerdown', e => { if (!ac || e.target.closest('#gate,.chip')) return; send('tap', evTime(e)); });
addEventListener('keydown', e => {
  if (!ac || e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); send('tap', evTime(e)); }
  else if (e.code === 'Escape') send('esc');
});

/* ---------- frame: 60 fps while rolling, 30 otherwise ---------- */
const tmpC = new THREE.Color();
let last = performance.now(), lastDraw = 0, glLost = false, dotsOn = -1;
function updateRing(vt, now) {
  const tk = app.tk; if (!tk) { app.vis = null; return; }
  let bar, frac;

  else { const p = (vt - tk.T0) / tk.barDur; bar = Math.min(Math.floor(p), tk.bars - 1); frac = p >= tk.bars ? 1 : p - Math.floor(p); }
  const firstBar = bar < 1, jam = tk.kind === 'jam', guide = firstBar ? 1 : jam ? .55 : .2;   // visual pulses fade after bar 1: timing stays in the ear
  playhead.rotation.z = -frac * TAU; progMat.uniforms.uP.value = frac; phMat.opacity = guide; progMat.uniforms.uO.value = guide * .55;
  const chord = jam ? CHORDS[Math.max(0, bar) % 4] : null;
  progMat.uniforms.uC.value.setHex(chord ? chord.col : 0xffffff);
  // ticks pulse only in the first bar

  for (const m of ticks) { const dt = vt - ((bar < 0 ? tk.countStart : tk.T0 + bar * tk.barDur) + m.userData.k * tk.barDur / ticks.length), p = pulseOK && dt >= 0 && dt < .2 ? 1 - dt / .2 : 0; m.scale.x = m.userData.sx * (1 + p * 2); }
  // last bar's marks are wiped by the playhead as it comes round
  for (let i = liveHits.length - 1; i >= 0; i--) { const o = liveHits[i]; if (o.b < bar - 1 || (o.b === bar - 1 && frac >= o.pos)) { freeMark(o); liveHits.splice(i, 1); } else o.visible = o.b <= Math.max(bar, 0); }
  // centre
  const beatIdx = Math.min(3, Math.floor(frac * 4));
  if (app.view === 'count') center(String(beatIdx + 1), 'count-in', jam ? '' : takeLabel(), '#fff');
  if (app.view === 'jam') center(chord.n, '', `next: ${CHORDS[(bar + 1) % 4].n}`, '#fff', 'chord');
  if (beatIdx !== dotsOn) { dotsOn = beatIdx; [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === beatIdx)); }
  // light envelopes; beam colour = timing on the beat just played
  const sc = vt - tk.countStart, bd = tk.beat, ex = (d, s) => sc < 0 ? 0 : Math.exp(-((sc % d) / d) * s);
  const gb = Math.floor((vt - tk.T0) / bd) - 1, q = tk.npb / 4; let pc = COL.warm;
  if (!jam && gb >= 0 && gb < tk.bars * 4 && gb * q >= tk.start) { const e = []; for (let i = gb * q; i < gb * q + q; i++) if (tk.matched[i] !== undefined) e.push(tk.matched[i]); pc = e.length ? hitColor(e.reduce((a, b) => a + b, 0) / e.length) : COL.miss; }
  app.vis = { q: ex(bd, 6), e: ex(bd / 2, 6), bar: ex(tk.barDur, 3), down: sc < 0 ? 0 : Math.exp(-(sc % tk.barDur) / bd * 5), col: pc, chord: chord ? chord.col : 0xffffff, fade: firstBar ? 1 : .5 };
}
const washT = new THREE.Color(), base = { tolex: new THREE.Color(0x1b1210), cloth: new THREE.Color(0x2c2019), panel: new THREE.Color(0x2e2520), strip: new THREE.Color(0x4a3020) };
function updateRoom(dt, now) {
  const v = app.view, st = M.state, A0 = { q: 0, e: 0, bar: 0, down: 0, col: COL.warm, chord: 0xffffff, fade: 1 }, s = app.vis || A0;
  const rolling = v === 'count' || v === 'take' || v === 'jam', talking = spk.active, listening = S[st].sr === 'listen';
  const flash = (RM ? .25 : 1) * (s.fade ?? 1);
  let I = .08, c = COL.warm, lamp = .75;
  if (v === 'count') { I = .1 + .6 * s.q * flash; lamp = .4; }
  else if (v === 'take') { I = .2 + .85 * s.q * flash; c = s.col; lamp = .22; }
  else if (v === 'jam') { I = .18 + .75 * s.q * flash; c = s.chord; lamp = .25; }
  else if (v === 'moved' && app.gauge) { I = .08 + .34 * gaugeMat.uniforms.uP.value; c = COL.warm; lamp = .9; }
  else if (v === 'where') { I = .12; lamp = 1.15; }
  else if (listening) { I = .16; c = COL.listen; }
  else if (talking) { I = .14; c = COL.coach; }
  // the wash: snappy while playing, slow between takes
  washT.setHex(c).multiplyScalar(I);
  const k = rolling || RM ? 1 : 1 - Math.exp(-dt * 4);
  room.uWash.value.lerp(washT, k); room.uLamp.value += (lamp - room.uLamp.value) * (RM ? 1 : .08);
  const w = room.uWash.value;
  stripMat.color.copy(base.strip).lerp(washT, .5).add(tmpC.copy(w).multiplyScalar(2.2));
  tolex.color.copy(base.tolex).add(tmpC.copy(w).multiplyScalar(.07));
  clothMat.color.copy(base.cloth).add(tmpC.copy(w).multiplyScalar(.5));
  panelMat.color.copy(base.panel).add(tmpC.copy(w).multiplyScalar(.1));
  // cone: pumps with the kick (beats 1 and 3), flutters when the coach talks through the amp
  const kick = rolling ? (app.tk ? Math.exp(-((Math.max(0, (ac.currentTime - lat()) - app.tk.countStart) % (app.tk.beat * 2)) / app.tk.beat) * 5) : 0) : 0;
  const flex = RM ? 0 : kick * .9 * (s.fade ?? 1) + (talking ? .22 + .2 * Math.sin(now * .037) * Math.sin(now * .011) : 0);
  cone.scale.setScalar(1 + flex * .018); coneMat.uniforms.uFlex.value = flex;
  // jewel = coach speaking / your turn. Tubes = signal coming in
  jewel.material.color.setHex(talking ? COL.coach : listening ? COL.listen : 0xffb777); jewel.material.opacity = talking ? .75 + .25 * Math.sin(now * .02) : listening ? .9 : .35;
  const lvl = clamp(app.level * 14, 0, 1), tg = v === 'jam' ? .45 + s.e * .55 : .45 + Math.max(lvl, app.pulse) * .55; app.pulse *= .88;
  tubes.forEach((t, i) => { t.material.opacity = tg * (1 - i * .08); });
  const bpm = app.sess?.bpm || 60; knobs[0].ptr.parent.rotation.z = -((bpm - 90) / 70) * 2.2;     // the tempo knob really is the tempo
  lampGlow.material.opacity = .25 + room.uLamp.value * .4;
  if (v === 'check') { const lv = (lvl * 100).toFixed(0) + '%'; if (ui.l !== lv) { ui.l = lv; $('lvl').firstChild.style.width = lv; } }
  if (v === 'where') { const tW = (now - (app.whereT || 0)) / 1000; NOTES.forEach((el, i) => { if (RM || tW > .35 + i * .3) el.classList.add('show'); }); }
}
function frame(now) {

  if (now - lastDraw < (rolling ? 1000 / 60 : 1000 / 30) - 2) return; lastDraw = now;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const vt = ac ? ac.currentTime - lat() : 0;
  updateRing(vt, now);
  updateRoom(dt, now);
  if (app.view === 'moved' && app.gauge) {
    const g = app.gauge, k = RM ? 1 : clamp((now - g.t0 - 300) / 1500, 0, 1), e = 1 - (1 - k) ** 3, val = g.from + (g.to - g.from) * e;
    gaugeMat.uniforms.uP.value = val; center(Math.round(val * 100) + '%', 'in the pocket', g.sub, '#fff');
  }
  const ck = RM ? 1 : 1 - Math.exp(-dt * 2.2);
  cam.z += (cam.tz - cam.z) * ck; camera.position.z = cam.z; cam.y += (cam.ty - cam.y) * ck; camera.position.y = cam.y;
  if (!glLost) renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { renderer.setAnimationLoop(null); ac?.suspend(); window.speechSynthesis?.pause(); }
  else { last = performance.now(); renderer.setAnimationLoop(frame); ac?.resume(); window.speechSynthesis?.resume(); requestWake(); }
});
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); glLost = true; });
renderer.domElement.addEventListener('webglcontextrestored', () => { glLost = false; });
let wake = null; async function requestWake() { try { if (M.state !== 'gate' && navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.onrelease = () => { wake = null; }; } } catch {} }

/* ---------- start ---------- */
$('go').addEventListener('click', async () => {
  $('go').textContent = '…'; initAudio(); await ac.resume();
  if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } // unlock iOS TTS
  await initMic();
  $('gate').style.display = 'none'; newSession(); M.state = 'gate'; go('check_hear'); requestWake();
});
window.__yames = {
  app, M, S, get state() { return M.state; }, get view() { return app.view; }, get input() { return app.input; },
  command: t => { const c = LOOK.get(norm(String(t))) || (LABEL[t] ? t : null); return c ? dispatchCmd(c) : heardFinal([String(t)]); },
  hear: t => heardFinal([t]), setSrMode: m => { SR.ok = true; SR.mode = m; }, micOnset: (t, e = .3) => onMic({ t, e }), audioNow: () => ac.currentTime, lat, spk, parseCmd, pending: () => tr.ev.length - tr.i,
};
